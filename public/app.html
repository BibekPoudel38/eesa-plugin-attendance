<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attendance</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <script src="/vendor/leaflet/leaflet.js"></script>
  <style>
    /* ---- Theme tokens. Light is the base; dark applies when the host asks
           (data-theme="dark") or, before the host message arrives, when the OS
           prefers dark. The host (Flutter/React) sends the phone's theme over
           the postMessage bridge, so the plugin always matches the app. ---- */
    /* ---- Eesa's own palette, value for value.
       These are not "a teal that goes with Eesa" — they are the exact tokens
       from the app's AppColors, so the plugin embedded in the Eesa shell is the
       same colour as the screen it opened from. Eesa's brand accent is PURPLE
       (#5B2BD6 light / #9C6BF5 dark); this UI had been painting itself teal,
       which is why it read as somebody else's app. ---- */
    :root {
      color-scheme: light dark;
      --bg:#FCFCFC;
      --grad: radial-gradient(1100px 460px at 50% -160px, rgba(91,43,214,.10), transparent 72%);
      --card:#FFFFFF; --card-2:#F2F6F8; --line:#E2E5E8;
      --ink:#090E12; --muted:#5D646A; --faint:#8A9197;
      --primary:#5B2BD6; --primary-ink:#FCFCFC; --primary-weak:rgba(91,43,214,.10);
      --success:#00A461; --success-weak:rgba(0,164,97,.13);
      --warn:#E68D00; --warn-weak:rgba(230,141,0,.15);
      --danger:#DF2225; --danger-weak:rgba(223,34,37,.12);
      --shadow:0 1px 2px rgba(9,14,18,.05), 0 10px 30px rgba(9,14,18,.06);
      --radius:16px; --radius-sm:11px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#090D0F;
        --grad: radial-gradient(1100px 460px at 50% -160px, rgba(156,107,245,.14), transparent 72%);
        --card:#121518; --card-2:#181C1F; --line:#1F2326;
        --ink:#F3F5F7; --muted:#8C9399; --faint:#6B7278;
        --primary:#9C6BF5; --primary-ink:#05080B; --primary-weak:rgba(156,107,245,.16);
        --success:#00BD79; --success-weak:rgba(0,189,121,.16);
        --warn:#FBA100; --warn-weak:rgba(251,161,0,.16);
        --danger:#DF2225; --danger-weak:rgba(223,34,37,.18);
        --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.34);
      }
    }
    :root[data-theme="dark"] {
      --bg:#090D0F;
      --grad: radial-gradient(1100px 460px at 50% -160px, rgba(156,107,245,.14), transparent 72%);
      --card:#121518; --card-2:#181C1F; --line:#1F2326;
      --ink:#F3F5F7; --muted:#8C9399; --faint:#6B7278;
      --primary:#9C6BF5; --primary-ink:#05080B; --primary-weak:rgba(156,107,245,.16);
      --success:#00BD79; --success-weak:rgba(0,189,121,.16);
      --warn:#FBA100; --warn-weak:rgba(251,161,0,.16);
      --danger:#DF2225; --danger-weak:rgba(223,34,37,.18);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.34);
    }

    * { box-sizing: border-box; }
    html, body { height:100%; }
    body {
      margin:0; color:var(--ink);
      background:var(--grad), var(--bg); background-attachment:fixed;
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    .ic { width:1em; height:1em; flex:none; vertical-align:-.12em; }

    /* Header */
    header {
      position:sticky; top:0; z-index:5;
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:14px 18px; background:color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);
    }
    .brand { display:flex; align-items:center; gap:10px; font-weight:750; letter-spacing:-.01em; }
    .brand .logo {
      width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
      background:var(--primary); color:var(--primary-ink); font-size:1rem;
    }
    .brand h1 { font-size:1.02rem; margin:0; font-weight:750; }
    .whochip { display:flex; align-items:center; gap:9px; }
    .whochip .avatar {
      width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
      background:var(--primary-weak); color:var(--primary); font-weight:700; font-size:.82rem;
    }
    .whochip .meta { text-align:right; line-height:1.15; }
    .whochip .nm { font-size:.82rem; font-weight:650; }
    .whochip .rl { font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }

    /* Nav */
    nav { display:flex; gap:7px; padding:12px 14px 4px; overflow-x:auto; scrollbar-width:none; }
    nav::-webkit-scrollbar { display:none; }
    nav button {
      display:inline-flex; align-items:center; gap:7px; white-space:nowrap; cursor:pointer;
      background:var(--card); border:1px solid var(--line); color:var(--muted);
      padding:8px 14px; border-radius:999px; font-size:.83rem; font-weight:600;
      transition:all .15s ease; box-shadow:var(--shadow);
    }
    nav button:hover { color:var(--ink); }
    nav button.active { background:var(--primary); color:var(--primary-ink); border-color:transparent; }
    nav button .ic { width:15px; height:15px; }

    main { padding:14px 16px 40px; max-width:860px; margin:0 auto; }
    .fade { animation:fade .28s ease; }
    @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

    /* Cards */
    .card {
      background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
    }
    .card > h2 {
      margin:0 0 12px; font-size:.72rem; color:var(--muted);
      text-transform:uppercase; letter-spacing:.08em; font-weight:700;
      display:flex; align-items:center; gap:7px;
    }
    .card > h2 .ic { color:var(--primary); width:15px; height:15px; }
    .lead { margin:0 0 12px; color:var(--muted); font-size:.86rem; line-height:1.45; }

    /* Hero (staff status) */
    .hero {
      position:relative; overflow:hidden; border-radius:var(--radius);
      padding:22px; margin-bottom:14px; border:1px solid var(--line);
      background:var(--card); box-shadow:var(--shadow);
    }
    .hero--on { background:linear-gradient(135deg,#00A461,#00875A 92%); color:#fff; border-color:transparent; }
    .hero__top { display:flex; align-items:center; gap:12px; }
    .hero__badge {
      width:46px; height:46px; border-radius:13px; display:grid; place-items:center;
      background:var(--primary-weak); color:var(--primary); font-size:1.3rem;
    }
    .hero--on .hero__badge { background:rgba(255,255,255,.2); color:#fff; }
    .hero__state { font-size:1.5rem; font-weight:800; letter-spacing:-.02em; line-height:1.1; }
    .hero__sub { font-size:.9rem; opacity:.82; margin-top:2px; }
    .stats { display:flex; gap:10px; margin-top:18px; }
    .stat { flex:1; border-radius:var(--radius-sm); padding:12px 14px; background:var(--card-2); }
    .hero--on .stat { background:rgba(255,255,255,.14); }
    .stat__num { font-size:1.35rem; font-weight:800; letter-spacing:-.02em; }
    .stat__lbl { font-size:.68rem; opacity:.82; text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
    .pulse { width:9px; height:9px; border-radius:50%; background:#fff; box-shadow:0 0 0 0 rgba(255,255,255,.7); animation:pulse 1.8s infinite; display:inline-block; margin-left:8px; vertical-align:middle; }
    @keyframes pulse { 70% { box-shadow:0 0 0 9px rgba(255,255,255,0); } 100% { box-shadow:0 0 0 0 rgba(255,255,255,0); } }

    /* Tables */
    table { width:100%; border-collapse:collapse; font-size:.86rem; }
    thead th {
      text-align:left; padding:8px 10px; color:var(--faint); font-weight:700;
      font-size:.68rem; text-transform:uppercase; letter-spacing:.05em;
      border-bottom:1px solid var(--line);
    }
    tbody td { padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr { transition:background .12s; }
    tbody tr:hover { background:var(--card-2); }
    .num { font-variant-numeric:tabular-nums; }

    /* List rows (history / zones as chips) */
    .rowitem { display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); }
    .rowitem:last-child { border-bottom:none; }
    .rowitem .lead-ic { width:34px; height:34px; border-radius:10px; background:var(--primary-weak); color:var(--primary); display:grid; place-items:center; flex:none; }
    .rowitem .grow { flex:1; min-width:0; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); font-size:.82rem; }
    .chip .ic { color:var(--primary); width:15px; height:15px; }

    .muted { color:var(--muted); }
    .err { color:var(--danger); }
    .ok { color:var(--success); }
    .empty { text-align:center; color:var(--muted); padding:26px 10px; font-size:.88rem; }
    .empty .ic { width:26px; height:26px; opacity:.5; display:block; margin:0 auto 8px; }

    /* Inputs / buttons */
    input, select {
      font:inherit; font-size:.86rem; padding:9px 11px; border-radius:10px;
      border:1px solid var(--line); background:var(--card-2); color:var(--ink); width:100%;
    }
    input:focus, select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-weak); }
    .btn {
      font:inherit; font-size:.85rem; font-weight:650; padding:9px 14px; border-radius:10px;
      border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;
      display:inline-flex; align-items:center; gap:7px; transition:all .14s;
    }
    .btn:hover { border-color:var(--primary); }
    .btn.primary { background:var(--primary); color:var(--primary-ink); border-color:transparent; }
    .btn.primary:hover { filter:brightness(1.06); }
    .btn.small { padding:6px 10px; font-size:.78rem; }
    .btn.link { background:transparent; border:none; color:var(--primary); padding:4px 6px; font-weight:650; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .field { display:flex; flex-direction:column; gap:5px; font-size:.72rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
    .field input, .field select { width:auto; text-transform:none; font-weight:400; letter-spacing:0; }

    .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:.72rem; font-weight:700; text-transform:capitalize; }
    .pill.pending, .pill.open, .pill.incomplete { background:var(--warn-weak); color:var(--warn); }
    .pill.approved, .pill.complete { background:var(--success-weak); color:var(--success); }
    .pill.rejected { background:var(--danger-weak); color:var(--danger); }

    .toast {
      position:fixed; left:50%; bottom:22px; transform:translate(-50%,10px); z-index:50;
      background:var(--card); border:1px solid var(--line); padding:11px 16px; border-radius:12px;
      font-size:.86rem; font-weight:600; box-shadow:var(--shadow); opacity:0; pointer-events:none;
      transition:opacity .2s, transform .2s;
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .toast.err { border-color:var(--danger); color:var(--danger); }

    /* Zone map */
    #zmap { height:340px; border-radius:var(--radius-sm); border:1px solid var(--line); margin-bottom:10px; z-index:0; }
    #zmap .leaflet-container { background:var(--card-2); font:inherit; }
    :root[data-theme="dark"] #zmap .leaflet-tile,
    :root:not([data-theme="light"]) #zmap .leaflet-tile { filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9); }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) #zmap .leaflet-tile { filter:none; } }
    .zpin { width:16px; height:16px; box-sizing:border-box; border-radius:50%; background:var(--primary); border:2px solid #fff; box-shadow:0 0 0 1px var(--primary); cursor:grab; }
    .zhandle { width:14px; height:14px; box-sizing:border-box; border-radius:50%; background:#fff; border:2px solid var(--primary); cursor:ew-resize; }
    .map-hint { font-size:.74rem; color:var(--muted); margin:-2px 0 10px; }
    /* A person's last-known position on the zone map. Green = still checked in,
       grey = checked out, so "who is here now" reads at a glance. */
    .ppin { width:14px; height:14px; box-sizing:border-box; border-radius:50%; background:var(--muted); border:2px solid #fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.25); }
    .ppin.in { background:var(--success); }
    .legend { display:flex; flex-wrap:wrap; gap:12px; align-items:center; font-size:.74rem; color:var(--muted); margin:-2px 0 10px; }
    .legend .k { display:inline-flex; align-items:center; gap:5px; }
    .legend .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }

    /* Toolbars (search + filters above a table) */
    /* The one card that is asking for a decision. Given the warning tint rather
       than another neutral card so it reads as an inbox, not as more data. */
    .card.needs { border-color:var(--warn); box-shadow:0 0 0 1px var(--warn-weak) inset, var(--shadow); }
    .confirmrow { align-items:center; }
    .confirmbtns { display:flex; gap:6px; flex-shrink:0; }
    /* Two words on one line. "Not here" breaking after "Not" made the pair of
       buttons different heights and the row read as broken. */
    .confirmbtns .btn { white-space:nowrap; }
    @media (max-width:420px) {
      .confirmrow { flex-wrap:wrap; }
      .confirmbtns { width:100%; margin-top:8px; }
      .confirmbtns .btn { flex:1; }
    }
    /* Secondary tools, folded away until wanted. */
    details.fold > summary {
      cursor:pointer; font-weight:700; font-size:1rem; display:flex; align-items:center; gap:8px;
      list-style:none; color:var(--ink);
    }
    details.fold > summary::-webkit-details-marker { display:none; }
    details.fold > summary::after { content:'+'; margin-left:auto; color:var(--muted); font-weight:400; font-size:1.2rem; }
    details.fold[open] > summary::after { content:'−'; }
    details.fold > summary:focus-visible { outline:2px solid var(--primary); outline-offset:3px; }
    /* `hidden` must actually hide.
       An element carrying the hidden attribute was still laid out, because the
       UA rule [hidden]{display:none} loses to any class here that sets its own
       display — .toolbar{display:flex} did exactly that, so the custom date
       pickers stayed on screen underneath a selected preset. */
    [hidden] { display:none !important; }

    /* One segmented control, on one line — the shape Eesa uses for the same job,
       rather than a bag of pills that wraps to two rows and reads as clutter.
       It scrolls sideways instead of wrapping, so adding a period never changes
       the height of the screen. */
    .periods {
      display:flex; gap:2px; margin-bottom:8px;
      background:var(--card-2); border:1px solid var(--line);
      border-radius:11px; padding:3px;
      overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
    }
    .periods::-webkit-scrollbar { display:none; }
    .periods button {
      flex:1 0 auto; white-space:nowrap;
      background:transparent; border:none; color:var(--muted);
      border-radius:8px; padding:7px 12px; font-size:.8rem; font-weight:600;
      cursor:pointer; font-family:inherit;
    }
    .periods button:hover { color:var(--ink); }
    .periods button.active { background:var(--primary); color:var(--primary-ink); }
    .periods button:focus-visible { outline:2px solid var(--primary); outline-offset:-2px; }
    /* The chosen period's own dates, shown small under the control: "This month"
       is only meaningful if you can see which days it actually covers. */
    /* The number the screen exists to answer, at the size that means nobody
       has to work it out from a start time. */
    .bigclock { display:flex; align-items:baseline; gap:8px; margin:14px 0 2px; }
    .bigclock span:first-child { font-size:2.5rem; font-weight:800; letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums; }
    .bigclock__lbl { font-size:.82rem; font-weight:600; opacity:.72; }
    .rangerow { display:flex; align-items:center; gap:8px; margin:0 0 12px; }
    .rangenote { color:var(--faint); font-size:.74rem; }
    .rangerow .btn.link { margin-left:auto; font-size:.74rem; padding:2px 0; flex-shrink:0; }
    .rangerow .btn.link.active { text-decoration:underline; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    .toolbar input[type="search"], .toolbar input.search { flex:1; min-width:180px; }
    .toolbar select { width:auto; min-width:120px; }
    .count { font-size:.74rem; color:var(--muted); margin-left:auto; white-space:nowrap; }

    /* Event drill-down under a day row */
    .evt { display:flex; gap:10px; align-items:flex-start; padding:8px 0 8px 10px; border-left:2px solid var(--line); margin-left:6px; font-size:.8rem; }
    .evt .t { font-variant-numeric:tabular-nums; font-weight:650; width:62px; flex:none; }
    .evt .g { flex:1; min-width:0; }
    .tag { display:inline-block; padding:1px 7px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); font-size:.68rem; color:var(--muted); margin-left:6px; }
    a.maplink { color:var(--primary); text-decoration:none; font-weight:600; }
    a.maplink:hover { text-decoration:underline; }
    /* Per-user job-type picks */
    .wtwrap { display:flex; flex-wrap:wrap; gap:8px 16px; }
    .wtchk { display:inline-flex; align-items:center; gap:6px; font-size:.82rem; white-space:nowrap; }
    .wtchk input { width:auto; }
    tr.wtrow td { padding-top:2px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">✦</span>
      <h1>Attendance</h1>
    </div>
    <div class="whochip" id="who"><span class="muted" style="font-size:.82rem">connecting…</span></div>
  </header>
  <nav id="nav"></nav>
  <main id="view"><div class="empty">Loading…</div></main>
  <div class="toast" id="toast"></div>

  <script>
    let TOKEN = null, CTX = null, TAB = null, ME_TICK = null;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
    const hrs = (m) => (Number(m || 0) / 60).toFixed(1);
    // "0.0" for a 40-minute shift reads as a bug. Show hours only once there
    // is an hour to show, minutes below that, and a plain dash for nothing.
    const dur = (m) => {
      const n = Math.max(0, Math.round(Number(m || 0)));
      if (!n) return '—';
      if (n < 60) return n + 'm';
      const h = Math.floor(n / 60), r = n % 60;
      return r ? `${h}h ${r}m` : `${h}h`;
    };
    const timeOf = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
    const dateNice = (s) => { if (!s) return '—'; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }); };
    const today = () => new Date().toISOString().slice(0, 10);
    const daysAgo = (n) => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);
    const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    // Named periods, resolved against the phone's own calendar.
    //
    // Weeks start on MONDAY. A rota week that starts on Sunday (the JS default
    // for getDay() === 0) would put Sunday's hours in the wrong week and make
    // every weekly total disagree with the day rows underneath it.
    const PERIODS = {
      today:  { label: 'Today',      range: () => { const d = new Date(); return [ymd(d), ymd(d)]; } },
      week:   { label: 'Week',       range: () => {
        const d = new Date(); const dow = (d.getDay() + 6) % 7;   // Mon = 0
        const s = new Date(d); s.setDate(d.getDate() - dow);
        return [ymd(s), ymd(d)];
      } },
      month:  { label: 'Month',      range: () => {
        const d = new Date();
        return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), ymd(d)];
      } },
      last:   { label: 'Last month', range: () => {
        const d = new Date();
        return [ymd(new Date(d.getFullYear(), d.getMonth() - 1, 1)),
                ymd(new Date(d.getFullYear(), d.getMonth(), 0))];
      } },
    };

    // Which preset a from/to pair corresponds to, so reopening a screen shows
    // the chip you chose rather than always falling back to Custom.
    const presetFor = (from, to) => {
      for (const [k, p] of Object.entries(PERIODS)) {
        const [f, t] = p.range();
        if (f === from && t === to) return k;
      }
      return 'custom';
    };
    const initials = (s) => (String(s || '?').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('') || '?').toUpperCase();
    const metres = (m) => (m == null ? '' : m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1)} km`);
    const osm = (lat, lng) => `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=18/${lat}/${lng}`;

    // ---- Verification badges --------------------------------------------------
    // Whether a punch's location could be confirmed against its zone. This is a
    // MARKER, never a filter: unverified attendance is always shown, because it
    // is usually honest (no GPS indoors, an admin correction) and hiding it would
    // just look like lost time to the person who worked it.
    const VERIFY = {
      verified:   { label: 'Verified',   cls: 'approved', hint: 'Location confirmed inside the work zone.' },
      partial:    { label: 'Partly verified', cls: 'pending', hint: 'Some punches this day had no location to check.' },
      unverified: { label: 'Unverified', cls: 'pending', hint: 'No location was recorded, so the system could not confirm it. The record still counts.' },
      outside:    { label: 'Outside zone', cls: 'rejected', hint: 'Recorded outside the work zone.' },
    };
    /// Did a person vouch for this shift — a different question from whether the
    /// phone's location backed it up, and shown separately because the two fail
    /// independently. Nothing is drawn when confirmation never applied (a
    /// manager's own shift, or the setting switched off): an empty cell says
    /// "not asked", which is the truth, where a grey "—" would read as a
    /// failure.
    // Classes reuse the existing pill palette — approved/pending/rejected — so
    // these read as the same family as the location badge beside them rather
    // than as a second, differently-styled idea.
    const CONFIRM = {
      confirmed:   { cls: 'approved', label: 'Confirmed',     hint: 'A manager confirmed this person was on site.' },
      pending:     { cls: 'pending',  label: 'Awaiting you',  hint: 'Nobody has confirmed this arrival yet. The clock is running either way.' },
      unconfirmed: { cls: 'pending',  label: 'Not confirmed', hint: 'The shift ended before anyone confirmed the person was on site. The hours still count.' },
      rejected:    { cls: 'rejected', label: 'Marked absent', hint: 'A manager recorded that this person was not on site at check-in.' },
    };
    const cbadge = (state) => {
      const c = CONFIRM[state];
      return c ? `<span class="pill ${c.cls}" title="${esc(c.hint)}">${esc(c.label)}</span>` : '';
    };

    const vbadge = (state, reason) => {
      const v = VERIFY[state];
      if (!v) return '';
      return `<span class="pill ${v.cls}" title="${esc(reason || v.hint)}">${esc(v.label)}</span>`;
    };

    // "Main Office · 34 m from centre (±8 m) · map" — where a punch happened,
    // always paired with a link so the admin can see it for themselves.
    const whereText = (loc) => {
      if (!loc) return '<span class="muted">No location</span>';
      const bits = [];
      if (loc.zoneName) bits.push(esc(loc.zoneName));
      if (loc.distanceM != null) bits.push(`${metres(loc.distanceM)} from centre`);
      if (loc.accuracyM != null) bits.push(`±${metres(loc.accuracyM)}`);
      const link = `<a class="maplink" target="_blank" rel="noopener" href="${osm(loc.lat, loc.lng)}">map</a>`;
      return `${bits.join(' · ') || `${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}`} · ${link}`;
    };

    // How a punch got recorded, in words the admin didn't have to learn.
    const SOURCE_LABEL = {
      geofence: 'Automatic (arrived/left zone)', banner: 'Tapped in the app',
      prompt: 'Answered the notification', manual: 'Logged by an admin', nfc: 'NFC tag',
    };

    // One punch as a timeline row: when, what, where, how it was recorded, and
    // whether the location checks out.
    const eventHtml = (e) => {
      const kind = e.type === 'check_in'
        ? (e.forWork === false ? 'On site — not for work' : 'Checked in')
        : 'Checked out';
      return `<div class="evt">
        <div class="t">${esc(timeOf(e.at))}</div>
        <div class="g">
          <div style="font-weight:650">${esc(kind)}${e.workType ? `<span class="tag">${esc(e.workType)}</span>` : ''} ${vbadge(e.verification, e.verificationReason)}</div>
          <div class="muted" style="font-size:.76rem;margin-top:3px">${whereText(e.location)}</div>
          <div class="muted" style="font-size:.72rem;margin-top:1px">${esc(SOURCE_LABEL[e.source] || e.source)}</div>
        </div>
      </div>`;
    };

    // ---- inline icon set (stroke, currentColor) ----
    const ICONS = {
      download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
      bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      check: '<path d="M20 6L9 17l-5-5"/>',
      pin: '<path d="M12 21s-6-5.7-6-10a6 6 0 0 1 12 0c0 4.3-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
      user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
      users: '<circle cx="9" cy="8" r="3.4"/><path d="M2.6 21a6.4 6.4 0 0 1 12.8 0"/><path d="M16.2 5.6a3.4 3.4 0 0 1 0 6.6"/><path d="M18.4 21a6.4 6.4 0 0 0-3-5.4"/>',
      calendar: '<rect x="3" y="4.5" width="18" height="17" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
      chart: '<path d="M3 21h18"/><path d="M6.5 21v-6M12 21V6M17.5 21v-4"/>',
      sliders: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
      activity: '<path d="M3 12h4l3 8 4-16 3 8h4"/>',
      checkCircle: '<circle cx="12" cy="12" r="9"/><path d="M8.4 12.4l2.6 2.6 4.6-5.2"/>',
      history: '<path d="M3.2 12a8.8 8.8 0 1 0 2.8-6.4L3 8"/><path d="M3 3.5V8h4.5"/><path d="M12 8v4.2l3 1.8"/>',
      inbox: '<path d="M4 13l2.5-8h11L20 13"/><path d="M4 13h5l1 2h4l1-2h5v6H4z"/>',
      briefcase: '<rect x="3" y="7.5" width="18" height="13" rx="2"/><path d="M9 7.5V5.5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 12.5h18"/>',
    };
    // Read the live accent so map overlays follow the theme rather than
    // hard-coding a colour that only suits one of them.
    const ZONE_RING = getComputedStyle(document.documentElement)
      .getPropertyValue('--primary').trim() || '#5B2BD6';
    const ic = (n) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ICONS.clock}</svg>`;
    const empty = (icon, msg) => `<div class="empty">${ic(icon)}${esc(msg)}</div>`;

    let toastTimer;
    function toast(msg, isErr) {
      const t = $('toast'); t.textContent = msg; t.classList.toggle('err', !!isErr);
      t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
    }

    // ---- theme: honor the host's light/dark (falls back to prefers-color-scheme) ----
    function applyTheme(t) {
      if (t === 'dark' || t === 'light') {
        document.documentElement.dataset.theme = t;
        if (window.__zmap) setTimeout(() => window.__zmap.invalidateSize(), 60);
      }
    }

    async function apiFull(path, { method = 'GET', body = null } = {}) {
      const opts = { method, headers: { Authorization: 'Bearer ' + TOKEN } };
      if (body != null) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const r = await fetch(path, opts);
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.ok === false) throw new Error((j.error && (j.error.message || j.error)) || ('HTTP ' + r.status));
      return j; // whole envelope: { ok, data, diag? }
    }
    const api = async (path, opts) => (await apiFull(path, opts)).data;

    const TABS = {
      today: ['Today', 'activity'], timesheets: ['Timesheets', 'chart'],
      people: ['People', 'users'], setup: ['Setup', 'sliders'],
      me: ['My attendance', 'user'], history: ['History', 'history'],
    };
    // Two branches of one shell — the tab set is the only thing that differs.
    //
    // Four admin sections, grouped by the job being done. The previous eight
    // split a single question across several screens: "what did this person
    // work" needed Logs, Approvals and Report, each with its own date range.
    const ADMIN_TABS = ['today', 'timesheets', 'people', 'setup'];
    const STAFF_TABS = ['me', 'history'];
    // How each Eesa-owned appRole reads in the header.
    const ROLE_LABEL = { admin: 'Admin', staff: 'Staff' };

    async function boot() {
      try {
        CTX = await api('/api/ui/context');
        // appRole (Eesa authority) is what we branch on: 'admin' | 'staff' | null.
        // Older builds only sent `role` ('manager'|'staff'|null); fall back to it
        // so a mixed deploy still resolves.
        const appRole = CTX.appRole || (CTX.role === 'manager' ? 'admin' : CTX.role) || null;
        const nm = CTX.name || 'You';
        const label = ROLE_LABEL[appRole] || '';
        $('who').innerHTML = `<div class="meta"><div class="nm">${esc(nm)}</div>${label ? `<div class="rl">${esc(label)}</div>` : ''}</div><div class="avatar">${esc(initials(nm))}</div>`;
        if (!appRole) {
          // Claim absent → not enrolled. Clean empty state, no nav.
          $('nav').innerHTML = '';
          $('view').innerHTML = `<div class="card">${empty('inbox', 'You’re not enrolled in attendance yet. Ask an admin to add you to the team.')}</div>`;
          return;
        }
        const tabs = appRole === 'admin' ? ADMIN_TABS : STAFF_TABS;
        $('nav').innerHTML = tabs.map((k) => `<button data-tab="${k}">${ic(TABS[k][1])}<span>${TABS[k][0]}</span></button>`).join('');
        $('nav').querySelectorAll('button').forEach((b) => b.onclick = () => go(b.dataset.tab));
        go(tabs[0]);
      } catch (e) {
        $('who').innerHTML = `<span class="err" style="font-size:.8rem">${esc(e.message)}</span>`;
      }
    }

    async function go(tab) {
      TAB = tab;
      $('nav').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
      $('view').innerHTML = '<div class="empty">Loading…</div>';
      try {
        await (VIEWS[tab] || (() => {}))();
        const v = $('view').firstElementChild; if (v) v.classList.add('fade');
      } catch (e) {
        $('view').innerHTML = `<div class="card">${empty('inbox', e.message || 'Something went wrong.')}<div style="text-align:center"><button class="btn small" id="retry">Try again</button></div></div>`;
        const rt = $('retry'); if (rt) rt.onclick = () => go(tab);
      }
    }

    const VIEWS = {};

    // ==================== STAFF ====================
    VIEWS.me = async () => {
      let st = null, zones = [];
      try { st = await api('/api/getMyStatus'); } catch (e) { throw new Error('Could not load your status: ' + e.message); }
      try { zones = await api('/api/getMyZones'); } catch (_) { zones = []; }
      const on = !!(st && st.checkedIn);
      const t = (st && st.today) || null;
      const evs = (st && st.events) || [];
      const where = on && st.zoneName ? ` at ${st.zoneName}` : '';
      // The order is the order the questions get asked: am I on the clock, for
      // how long, did today record correctly, and where does this even apply.
      // Hours-worked is the headline because it is the number people open this
      // for; first-in and last-out are the supporting detail, not the lead.
      const baseMin = Number((st && st.todayMinutes) || 0);
      const readAt = Date.now();
      $('view').innerHTML = `
        <div class="hero ${on ? 'hero--on' : ''}">
          <div class="hero__top">
            <div class="hero__badge">${ic(on ? 'check' : 'clock')}</div>
            <div>
              <div class="hero__state">${on ? 'On the clock' : 'Off the clock'}${on ? '<span class="pulse"></span>' : ''}</div>
              <div class="hero__sub">${on && st.since ? `Since ${timeOf(st.since)}${esc(where)}` : 'Arriving at a work zone checks you in automatically'}</div>
            </div>
          </div>
          <div class="bigclock"><span id="meclock">${dur(baseMin)}</span><span class="bigclock__lbl">today</span></div>
          ${t && (t.firstIn || t.lastOut) ? `<div class="stats">
            <div class="stat"><div class="stat__num num">${timeOf(t.firstIn)}</div><div class="stat__lbl">First in</div></div>
            <div class="stat"><div class="stat__num num">${t.lastOut ? timeOf(t.lastOut) : '—'}</div><div class="stat__lbl">Last out</div></div>
          </div>` : ''}
        </div>
        <div class="card">
          <h2>${ic('history')} Today’s punches</h2>
          ${evs.length ? evs.map(eventHtml).join('') : empty('history', 'Nothing recorded yet today.')}
          ${evs.some((e) => e.verification !== 'verified') ? `<p class="muted" style="font-size:.76rem;margin:12px 0 0">${esc(VERIFY.unverified.hint)}</p>` : ''}
        </div>
        <div class="card">
          <h2>${ic('pin')} Your work zones</h2>
          ${zones.length
            ? `<div class="chips">${zones.map((z) => `<span class="chip">${ic('pin')}${esc(z.name)}</span>`).join('')}</div>`
            : empty('pin', 'No work zones assigned yet — ask an admin to add one.')}
          <p class="muted" style="font-size:.78rem;margin:14px 0 0">Check-in and check-out happen automatically when you arrive at and leave a zone, from the Eesa app on your phone. You do not need to open anything.</p>
        </div>`;

      // Keep the clock honest while the page is open.
      //
      // The server already counted the open shift up to the moment it answered,
      // so the only correction is the time since — not a re-derivation from
      // `since`, which would double-count every earlier shift on a day with
      // more than one. Only runs while actually on the clock, and only while
      // this view is the one on screen.
      clearInterval(ME_TICK);
      if (on) {
        ME_TICK = setInterval(() => {
          const el = $('meclock');
          if (!el || TAB !== 'me') { clearInterval(ME_TICK); return; }
          el.textContent = dur(baseMin + Math.floor((Date.now() - readAt) / 60000));
        }, 20000);
      }
    };

    VIEWS.history = async () => {
      // Same period control the admin timesheet uses, for the same reason: "how
      // many hours have I done this month" is the question people actually open
      // this screen with, and a fixed 30-day window can only ever answer it by
      // accident.
      $('view').innerHTML = `
        <div class="card">
          <h2>${ic('history')} Your hours</h2>
          ${rangeBar('hi')}
          <div id="hitot"></div>
          <div id="hiout" class="muted">Loading…</div>
        </div>`;

      const run = async () => {
        $('hiout').innerHTML = '<span class="muted">Loading…</span>';
        $('hitot').innerHTML = '';
        const data = await api('/api/getMyHistory?' + new URLSearchParams({ from: RANGE.from, to: RANGE.to }));
        const rows = (data && data.days) || [];             // server returns { days: [...] }
        const totalMin = rows.reduce((a, r) => a + (Number(r.totalMinutes) || 0), 0);
        const worked = rows.filter((r) => (Number(r.totalMinutes) || 0) > 0).length;
        $('hitot').innerHTML = `
          <div class="stats" style="margin:0 0 14px">
            <div class="stat" style="background:var(--card-2)"><div class="stat__num num">${hrs(totalMin)}</div><div class="stat__lbl">Hours</div></div>
            <div class="stat" style="background:var(--card-2)"><div class="stat__num num">${worked}</div><div class="stat__lbl">Days worked</div></div>
            <div class="stat" style="background:var(--card-2)"><div class="stat__num num">${worked ? hrs(totalMin / worked) : '0.0'}</div><div class="stat__lbl">Avg / day</div></div>
          </div>`;
        $('hiout').innerHTML = `
          ${rows.length ? rows.map((r) => `
            <div class="rowitem" data-hday="${esc(r.date)}" style="cursor:pointer">
              <div class="lead-ic">${ic('calendar')}</div>
              <div class="grow">
                <div style="font-weight:650">${esc(dateNice(r.date))}</div>
                <div class="muted" style="font-size:.78rem">${timeOf(r.firstIn)} → ${r.lastOut ? timeOf(r.lastOut) : 'open'}</div>
                <div style="margin-top:4px">${vbadge(r.verification)}${cbadge(r.confirmStatus)}</div>
              </div>
              <div style="text-align:right">
                <div class="num" style="font-weight:700">${hrs(r.totalMinutes)} h</div>
                ${r.status ? `<span class="pill ${esc(r.status)}">${esc(r.status)}</span>` : ''}
              </div>
            </div>
            <div id="hev-${esc(r.date)}" style="display:none;padding:0 4px 10px"></div>`).join('') : empty('history', 'No attendance in this period. Pick a wider range, or your days will appear here once you start checking in.')}
          ${rows.some((r) => r.verification !== 'verified') ? `<p class="muted" style="font-size:.76rem;margin:12px 0 0">Days marked <em>Unverified</em> are still yours and still count — it only means the app couldn’t confirm the location at the time (no GPS signal, or the entry was logged by an admin). Tap a day to see each punch.</p>` : ''}`;
      // Tap a day to see the punches behind it, including any the system could
      // not verify — those are exactly the ones a person needs to be able to
      // look at and explain.
      $('hiout').querySelectorAll('[data-hday]').forEach((el) => {
        el.onclick = async () => {
          const day = el.dataset.hday;
          const box = $('hev-' + day);
          if (!box) return;
          if (box.style.display !== 'none') { box.style.display = 'none'; return; }
          box.style.display = '';
          box.innerHTML = '<span class="muted" style="font-size:.8rem">Loading…</span>';
          try {
            const evs = await api('/api/getMyEvents?' + new URLSearchParams({ from: day, to: day }));
            box.innerHTML = evs.length ? evs.slice().reverse().map(eventHtml).join('')
              : '<span class="muted" style="font-size:.8rem">No individual punches recorded for this day.</span>';
          } catch (e) {
            box.innerHTML = `<span class="err" style="font-size:.8rem">${esc(e.message)}</span>`;
          }
        };
      });
      };

      bindRange('hi', run);
      await run();
    };

    // ==================== ADMIN ====================
    // Four sections, grouped by what an admin is actually trying to do, rather
    // than by which database table the screen happens to read:
    //
    //   Today       who is here right now, and where
    //   Timesheets  what people worked -> approve it -> what they're owed
    //   People      who is enrolled, as what, at what rate
    //   Setup       the things you configure once: zones, shifts, timezone
    //
    // The previous eight tabs split one question across several places — "what
    // did this person work" lived in Logs, Approvals AND Report, each with its
    // own date range to set. Timesheets is now a single range and one drill-down
    // path: everyone -> one person's days -> the punches behind a day.

    // ---- shared bits -------------------------------------------------------

    // A date range remembered across sections, so moving between them doesn't
    // silently change the period you were looking at.
    // Defaults to THIS MONTH rather than a rolling 14 days. Payroll, overtime and
    // "how many hours have I done" are all month-shaped questions; a window that
    // straddles two months answers none of them without arithmetic.
    const RANGE = (() => { const [from, to] = PERIODS.month.range(); return { from, to }; })();

    const rangeBar = (id) => `
      <div class="periods" id="${id}p">
        ${Object.entries(PERIODS).map(([k, p]) =>
          `<button data-p="${k}" type="button">${p.label}</button>`).join('')}
      </div>
      <div class="rangerow">
        <span class="rangenote" id="${id}n"></span>
        <button class="btn link small" data-p="custom" id="${id}pick" type="button">Pick dates</button>
      </div>
      <div class="toolbar" id="${id}custom" hidden>
        <label class="field">From<input type="date" id="${id}f" value="${RANGE.from}"></label>
        <label class="field">To<input type="date" id="${id}t" value="${RANGE.to}"></label>
        <button class="btn" id="${id}go" style="align-self:flex-end">Apply</button>
        <span class="count" id="${id}c"></span>
      </div>`;

    const bindRange = (id, onApply) => {
      const chips = $(id + 'p');
      const custom = $(id + 'custom');
      const note = $(id + 'n');
      const pick = $(id + 'pick');
      const paint = () => {
        const active = presetFor(RANGE.from, RANGE.to);
        chips.querySelectorAll('button').forEach((b) =>
          b.classList.toggle('active', b.dataset.p === active));
        // Only the date inputs hide under a preset — never the segmented
        // control, so there is always a one-tap way back out of a custom range.
        custom.hidden = active !== 'custom';
        pick.classList.toggle('active', active === 'custom');
        note.textContent = RANGE.from === RANGE.to
          ? dateNice(RANGE.from)
          : `${dateNice(RANGE.from)} → ${dateNice(RANGE.to)}`;
      };
      // Repaint on EVERY change, not just at setup.
      //
      // This was the bug that made the whole control look dead: a tap set RANGE
      // and refetched, but nothing called paint() again — so the highlight and
      // the date line stayed on the period you had just left while the numbers
      // underneath quietly changed. Tapping "Week" looked like tapping nothing.
      const apply = () => { paint(); onApply(); };

      chips.querySelectorAll('button').forEach((b) => {
        b.onclick = () => {
          [RANGE.from, RANGE.to] = PERIODS[b.dataset.p].range();
          apply();
        };
      });
      pick.onclick = () => {
        custom.hidden = false;
        chips.querySelectorAll('button').forEach((x) => x.classList.remove('active'));
        pick.classList.add('active');
        $(id + 'f').focus();
      };
      $(id + 'go').onclick = () => {
        const f = $(id + 'f').value;
        const t = $(id + 't').value;
        if (!f || !t) return toast('Pick both dates', true);
        // A backwards range returns nothing and looks like "no data" rather than
        // like a mistake, so swap it instead of reporting an empty period.
        RANGE.from = f <= t ? f : t;
        RANGE.to = f <= t ? t : f;
        apply();
      };
      paint();
    };

    // Everyone enrolled, for the "pick a person" controls.
    const enrolled = async () => (await api('/api/admin/members')).filter((m) => m.role);

    // ==================== TODAY ====================
    // One screen for "what is happening right now": the headline count, everyone
    // on the map, the list with names and last-known location, and the manual
    // punch for when someone's phone let them down.
    VIEWS.today = async () => {
      const [presence, zones, waiting] = await Promise.all([
        api('/api/admin/presence'),
        api('/api/admin/zones').catch(() => []),
        api('/api/admin/confirmations').catch(() => []),
      ]);
      const rows = presence.employees || [];
      const people = rows.filter((p) => p.lastLocation);
      const inNow = rows.filter((r) => r.checkedIn).length;
      const hasMap = typeof window.L !== 'undefined';

      // Ordered by what an admin opens this screen to DO, not by what the
      // database has. Anything asking for a decision comes first; the map and
      // the manual punch are reference and repair, and were pushing the list of
      // people below the fold on a phone.
      $('view').innerHTML = `
        ${waiting.length ? `<div class="card needs">
          <h2>${ic('activity')} Waiting for you</h2>
          <p class="lead">${waiting.length === 1 ? 'One person has' : `${waiting.length} people have`} checked in and nobody has confirmed they're on site. Their clock is already running — this only records who vouched for it.</p>
          ${waiting.map((w) => `
            <div class="rowitem confirmrow">
              <div class="grow">
                <div style="font-weight:650">${esc(w.name || w.employeeRef)}</div>
                <div class="muted" style="font-size:.78rem">
                  Checked in ${timeOf(w.at)}${w.zoneName ? ` · ${esc(w.zoneName)}` : ''} · ${w.minutesAgo < 60 ? `${w.minutesAgo} min ago` : `${Math.floor(w.minutesAgo / 60)}h ${w.minutesAgo % 60}m ago`}
                </div>
              </div>
              <div class="confirmbtns">
                <button class="btn small" data-no="${esc(w.id)}">Not here</button>
                <button class="btn primary small" data-yes="${esc(w.id)}">Confirm</button>
              </div>
            </div>`).join('')}
        </div>` : ''}

        <div class="hero ${inNow ? 'hero--on' : ''}">
          <div class="hero__top">
            <div class="hero__badge">${ic('activity')}</div>
            <div>
              <div class="hero__state">${inNow} on site${inNow ? '<span class="pulse"></span>' : ''}</div>
              <div class="hero__sub">${inNow ? 'currently checked in' : 'nobody is checked in right now'}</div>
            </div>
          </div>
          <div class="stats">
            <div class="stat"><div class="stat__num num">${rows.length}</div><div class="stat__lbl">Active today</div></div>
            <div class="stat"><div class="stat__num num">${zones.length}</div><div class="stat__lbl">Work zones</div></div>
            <div class="stat"><div class="stat__num num">${rows.filter((r) => r.verification !== 'verified').length}</div><div class="stat__lbl">Unconfirmed</div></div>
          </div>
        </div>

        <div class="card">
          <h2>${ic('users')} Who's in</h2>
          ${rows.length ? `
            <div class="toolbar">
              <input class="search" id="pq" type="search" placeholder="Search name" autocomplete="off">
              <select id="pf">
                <option value="">Everyone active today</option>
                <option value="in">On the clock</option>
                <option value="out">Checked out</option>
                <option value="unverified">Location not confirmed</option>
              </select>
              <span class="count" id="pcount"></span>
            </div>
            <div id="pbody"></div>`
            : empty('activity', 'Nobody has checked in yet today.')}
        </div>

        ${hasMap && people.length ? `<div class="card">
          <h2>${ic('pin')} Where everyone is</h2>
          <div id="zmap"></div>
          <div class="legend">
            <span class="k"><span class="dot" style="background:var(--success)"></span> On the clock (${inNow})</span>
            <span class="k"><span class="dot" style="background:var(--muted)"></span> Checked out</span>
            <span class="k"><span class="dot" style="background:transparent;border:2px solid #8aa0a8"></span> Work zone</span>
          </div>
          <div class="map-hint">Each dot is where that person was when they <em>last punched</em> — phones report on arrival and departure, not continuously, so the label carries the time the position was taken.</div>
        </div>` : ''}

        <details class="card fold">
          <summary>${ic('clock')} Add a punch by hand</summary>
          <p class="lead">For a phone that was off, out of signal, or left at home. Recorded as entered by an admin, and marked as unconfirmed because there's no device location behind it.</p>
          <div class="row">
            <select id="mref" style="flex:1;min-width:170px"></select>
            <select id="mtype" style="width:auto">
              <option value="check_in">Checked in</option>
              <option value="check_out">Checked out</option>
            </select>
            <button class="btn primary" id="msave">Add</button>
          </div>
        </details>`;

      // --- confirmations ---
      const answer = async (id, status) => {
        try {
          await api('/api/admin/confirm', { method: 'POST', body: { eventId: id, status } });
          toast(status === 'confirmed' ? 'Confirmed' : 'Marked not here');
          go('today');
        } catch (e) { toast(e.message, true); }
      };
      $('view').querySelectorAll('[data-yes]').forEach((b) =>
        b.onclick = () => answer(b.dataset.yes, 'confirmed'));
      $('view').querySelectorAll('[data-no]').forEach((b) =>
        b.onclick = () => answer(b.dataset.no, 'rejected'));

      if (rows.length) {
        const render = () => {
          const qy = ($('pq').value || '').trim().toLowerCase();
          const f = $('pf').value;
          const list = rows.filter((r) => {
            if (qy && !`${r.name || ''} ${r.email || ''} ${r.employeeRef}`.toLowerCase().includes(qy)) return false;
            if (f === 'in' && !r.checkedIn) return false;
            if (f === 'out' && r.checkedIn) return false;
            if (f === 'unverified' && r.verification === 'verified') return false;
            return true;
          });
          $('pcount').textContent = list.length === rows.length
            ? `${rows.length} ${rows.length === 1 ? 'person' : 'people'}`
            : `${list.length} of ${rows.length}`;
          $('pbody').innerHTML = list.length
            ? `<table><thead><tr><th>Employee</th><th>Status</th><th>Since</th><th>Last known location</th></tr></thead><tbody>
              ${list.map((r) => `<tr>
                <td><div style="font-weight:600">${esc(r.name || r.employeeRef)}</div>${r.name && r.email ? `<div class="muted" style="font-size:.74rem">${esc(r.email)}</div>` : ''}</td>
                <td>${r.checkedIn ? '<span class="pill complete">In</span>' : '<span class="pill">Out</span>'}</td>
                <td class="num">${timeOf(r.at)}</td>
                <td><div>${whereText(r.lastLocation)}</div>
                    <div style="margin-top:4px">${vbadge(r.verification, r.verificationReason)} ${r.lastLocation ? `<span class="tag">as of ${esc(timeOf(r.lastLocation.at))}</span>` : ''}</div></td>
              </tr>`).join('')}</tbody></table>`
            : empty('activity', 'Nobody matches those filters.');
        };
        $('pq').oninput = render;
        $('pf').onchange = render;
        render();
      }

      // Manual punch
      const members = await enrolled().catch(() => []);
      $('mref').innerHTML = members.map((m) => `<option value="${esc(m.employeeRef)}">${esc(m.name || m.employeeRef)}</option>`).join('')
        || '<option value="">No enrolled staff</option>';
      $('msave').onclick = async () => {
        if (!$('mref').value) return toast('No staff to log for', true);
        try {
          await api('/api/admin/manual-entry', { method: 'POST', body: { employeeRef: $('mref').value, type: $('mtype').value } });
          toast('Punch added');
          go('today');
        } catch (e) { toast(e.message, true); }
      };

      if (hasMap && people.length) drawZoneMap(zones, people, { editable: false });
    };

    // ==================== TIMESHEETS ====================
    // The money question, start to finish: what everyone worked over a period →
    // one person's days → the punches behind a day, approving as you go.
    VIEWS.timesheets = async () => {
      $('view').innerHTML = `<div class="card">
        <h2>${ic('chart')} Timesheets</h2>
        <p class="lead">Hours worked over a period, what's still waiting on you, and what that comes to in pay. Click anyone to see their days and approve them.</p>
        ${rangeBar('ts')}
        <div class="row" style="margin:-4px 0 12px">
          <label class="wtchk"><input type="checkbox" id="tspend"> Only people awaiting approval</label>
          <label class="wtchk"><input type="checkbox" id="tsdetail"> Show pay &amp; schedule</label>
          <button class="btn small" id="tscsv" style="margin-left:auto">${ic('download')} Export CSV</button>
        </div>
        <div id="tstot"></div>
        <div id="tsout" class="muted">Loading…</div>
      </div>`;

      const run = async () => {
        $('tsout').innerHTML = '<span class="muted">Loading…</span>';
        const q = new URLSearchParams({ from: RANGE.from, to: RANGE.to });
        const [rows, approvals] = await Promise.all([
          api('/api/admin/report?' + q),
          api('/api/admin/approvals?' + q).catch(() => []),
        ]);
        // How many days per person still need a decision — the thing that tells
        // an admin where to go next, which the old Report never showed.
        const pending = new Map();
        for (const a of approvals) {
          if (a.approvalStatus === 'pending' && a.totalMinutes > 0) {
            pending.set(String(a.employeeRef), (pending.get(String(a.employeeRef)) || 0) + 1);
          }
        }
        const onlyPending = $('tspend').checked;
        const list = onlyPending ? rows.filter((r) => pending.get(String(r.employeeRef))) : rows;
        const totalPending = [...pending.values()].reduce((a, b) => a + b, 0);
        $('tsc').textContent = totalPending
          ? `${totalPending} day${totalPending === 1 ? '' : 's'} awaiting approval`
          : 'nothing awaiting approval';

        // The number the period is actually for. A table of per-person rows never
        // answers "what did this month cost" without the reader adding a column
        // up by hand, which is exactly the arithmetic a report exists to remove.
        const sum = (f) => list.reduce((a, r) => a + (Number(r[f]) || 0), 0);
        const tWorked = sum('totalMinutes');
        const tApproved = sum('approvedMinutes');
        const tExpected = sum('expectedMinutes');
        const tPay = list.reduce((a, r) => a + (Number(r.approvedPay) || 0), 0);
        const anySchedule = list.some((r) => r.hasSchedule);
        $('tstot').innerHTML = list.length ? `
          <div class="stats" style="margin:0 0 14px">
            <div class="stat" style="background:var(--card-2)">
              <div class="stat__num num">${dur(tWorked)}</div><div class="stat__lbl">Hours worked</div></div>
            <div class="stat" style="background:var(--card-2)">
              <div class="stat__num num">${dur(tApproved)}</div><div class="stat__lbl">Approved</div></div>
            ${anySchedule ? `<div class="stat" style="background:var(--card-2)">
              <div class="stat__num num">${dur(tExpected)}</div><div class="stat__lbl">Expected</div></div>` : ''}
            <div class="stat" style="background:var(--card-2)">
              <div class="stat__num num">${list.length}</div><div class="stat__lbl">People</div></div>
            ${tPay > 0 ? `<div class="stat" style="background:var(--card-2)">
              <div class="stat__num num">$${tPay.toFixed(2)}</div><div class="stat__lbl">Approved pay</div></div>` : ''}
          </div>` : '';

        // Three columns by default — who, how many days, how many hours — because
        // that is the whole question most of the time. Expected / difference /
        // approved / pay are four more columns that made this unreadable on a
        // phone to answer a question only payroll week asks, so they are behind
        // a toggle rather than always on.
        const detail = $('tsdetail').checked;
        $('tsout').innerHTML = list.length ? `<table>
          <thead><tr><th>Name</th><th>Days</th><th>Worked</th>${detail
            ? '<th>Expected</th><th>Diff</th><th>Approved</th><th>Pay</th>' : ''}<th></th></tr></thead>
          <tbody>${list.map((r, i) => {
            const p = pending.get(String(r.employeeRef)) || 0;
            const diff = r.hasSchedule
              ? `<span class="${r.differenceMinutes < 0 ? 'err' : 'ok'}">${r.differenceMinutes > 0 ? '+' : ''}${hrs(r.differenceMinutes)}</span>`
              : '<span class="muted">—</span>';
            return `<tr>
              <td><div style="font-weight:600">${esc(r.name || r.employeeRef)}</div>
                  ${p ? `<span class="pill pending">${p} pending</span>` : ''}</td>
              <td class="num">${r.days}</td>
              <td class="num"><strong>${dur(r.totalMinutes)}</strong></td>
              ${detail ? `
              <td class="num">${r.hasSchedule ? dur(r.expectedMinutes) : '<span class="muted">—</span>'}</td>
              <td class="num">${diff}</td>
              <td class="num">${dur(r.approvedMinutes)}</td>
              <td class="num">${r.approvedPay == null ? '<span class="muted">—</span>' : '$' + r.approvedPay.toFixed(2)}</td>` : ''}
              <td><button class="btn small" id="ts${i}">Open</button></td>
            </tr>`;
          }).join('')}</tbody></table>`
          : empty('chart', onlyPending ? 'Nothing is waiting for approval in this period.' : 'No attendance in this period.');

        list.forEach((r, i) => {
          const b = $('ts' + i);
          if (b) b.onclick = () => personTimesheet(String(r.employeeRef), r.name);
        });
      };
      // Download through fetch, not a plain link: the export is bearer-authed and
      // an <a href> cannot carry the token. The blob is revoked straight after
      // the click so the file isn't pinned in memory for the session.
      $('tscsv').onclick = async () => {
        const btn = $('tscsv');
        btn.disabled = true;
        try {
          const res = await fetch('/api/admin/export.csv?' + new URLSearchParams({ from: RANGE.from, to: RANGE.to }), {
            headers: { Authorization: 'Bearer ' + TOKEN },
          });
          if (!res.ok) throw new Error(`Export failed (${res.status})`);
          const url = URL.createObjectURL(await res.blob());
          const a = document.createElement('a');
          a.href = url;
          a.download = `attendance_${RANGE.from}_${RANGE.to}.csv`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          toast('Export downloaded');
        } catch (e) {
          toast(e.message, true);
        } finally {
          btn.disabled = false;
        }
      };
      $('tsdetail').onchange = run;
      bindRange('ts', run);
      $('tspend').onchange = run;
      await run();
    };

    // One person, one period: every day, its verification, its approval state,
    // and the punches behind it. Replaces the old Logs person page AND the
    // Approvals row-per-day table, which each showed half of this.
    async function personTimesheet(ref, name) {
      $('view').innerHTML = `<div class="card"><div class="muted">Loading ${esc(name || ref)}…</div></div>`;
      const q = new URLSearchParams({ employeeRef: ref, from: RANGE.from, to: RANGE.to });
      const [detail, approvals] = await Promise.all([
        api('/api/admin/employee-report?' + q),
        api('/api/admin/approvals?' + new URLSearchParams({ from: RANGE.from, to: RANGE.to })).catch(() => []),
      ]);
      const mine = new Map(approvals.filter((a) => String(a.employeeRef) === ref).map((a) => [a.day, a]));
      const days = (detail.days || []).filter((d) => d.firstIn || d.totalMinutes > 0);

      const render = () => {
        $('view').innerHTML = `
          <div class="card">
            <button class="btn small" id="back" style="margin-bottom:10px">← All timesheets</button>
            <h2>${ic('user')} ${esc(detail.name || name || ref)}</h2>
            ${rangeBar('pt')}
            <div class="stats" style="margin-top:10px">
              <div class="stat"><div class="stat__num num">${dur(detail.totalMinutes)}</div><div class="stat__lbl">Worked</div></div>
              <div class="stat"><div class="stat__num num">${detail.daysWorked}</div><div class="stat__lbl">Days</div></div>
              <div class="stat"><div class="stat__num num">${days.filter((d) => (mine.get(d.date) || {}).approvalStatus === 'pending').length}</div><div class="stat__lbl">To approve</div></div>
            </div>
          </div>
          <div class="card">
            <h2>${ic('calendar')} Days</h2>
            ${days.length ? `<table>
              <thead><tr><th>Date</th><th>In</th><th>Out</th><th>Worked</th><th>Location</th><th>Presence</th><th>Approval</th><th></th></tr></thead>
              <tbody>${days.map((d, i) => {
                const a = mine.get(d.date) || {};
                const st = a.approvalStatus || 'pending';
                return `<tr>
                  <td style="font-weight:600">${esc(dateNice(d.date))}</td>
                  <td class="num">${timeOf(d.firstIn)}</td>
                  <td class="num">${d.lastOut ? timeOf(d.lastOut) : `<span class="muted">${d.status === 'open' ? 'still in' : '—'}</span>`}</td>
                  <td class="num"><strong>${dur(d.totalMinutes)}</strong></td>
                  <td>${vbadge(d.verification)}</td>
                  <td>${cbadge(d.confirmStatus)}</td>
                  <td><span class="pill ${esc(st)}">${esc(st)}</span></td>
                  <td style="white-space:nowrap">
                    <button class="btn link" data-day="${esc(d.date)}">Punches</button>
                    ${st !== 'approved' ? `<button class="btn link" data-appr="approved" data-d="${esc(d.date)}">Approve</button>` : ''}
                    ${st !== 'rejected' ? `<button class="btn link" style="color:var(--danger)" data-appr="rejected" data-d="${esc(d.date)}">Reject</button>` : ''}
                  </td>
                </tr>
                <tr class="wtrow" id="ev-${esc(d.date)}" style="display:none"><td colspan="8"></td></tr>`;
              }).join('')}</tbody></table>`
              : empty('calendar', 'Nothing recorded in this period.')}
          </div>`;

        $('back').onclick = () => go('timesheets');

        // The same period control as everywhere else, on the screen where the
        // question is asked most: this person's days. It was a line of static
        // text, so changing the month meant backing out to the list, changing
        // it there, and drilling in again — three steps to answer "what about
        // last month". Changing it here reloads this person in place, and the
        // shared RANGE means the list you go back to has moved with you.
        bindRange('pt', () => personTimesheet(ref, name));

        $('view').querySelectorAll('button[data-day]').forEach((b) => {
          b.onclick = async () => {
            const day = b.dataset.day;
            const row = $('ev-' + day);
            if (row.style.display !== 'none') { row.style.display = 'none'; b.textContent = 'Punches'; return; }
            row.style.display = '';
            b.textContent = 'Hide';
            const cell = row.firstElementChild;
            cell.innerHTML = '<span class="muted" style="font-size:.8rem">Loading…</span>';
            try {
              const evs = await api('/api/admin/events?' + new URLSearchParams({ employeeRef: ref, from: day, to: day }));
              // A hand-typed punch gets a way to undo it; a device punch does
              // not, because the server will refuse and the button would only
              // teach people that buttons lie. See db.deleteManualEvent.
              cell.innerHTML = evs.length
                ? evs.slice().reverse().map((e) => eventHtml(e) + (e.source === 'manual'
                    ? `<div style="margin:-6px 0 10px 34px"><button class="btn link" style="color:var(--danger);padding:0" data-del="${esc(e.id)}">Remove this entry</button></div>`
                    : '')).join('')
                : '<span class="muted" style="font-size:.8rem">No individual punches recorded for this day.</span>';
              cell.querySelectorAll('[data-del]').forEach((db_) => {
                db_.onclick = async () => {
                  if (!confirm('Remove this hand-entered punch? The day\'s hours will be recalculated and the person will be told.')) return;
                  try {
                    await api('/api/admin/events/' + encodeURIComponent(db_.dataset.del), { method: 'DELETE' });
                    toast('Entry removed');
                    personTimesheet(ref, name);
                  } catch (err) { toast(err.message, true); }
                };
              });
            } catch (e) {
              cell.innerHTML = `<span class="err" style="font-size:.8rem">${esc(e.message)}</span>`;
            }
          };
        });

        $('view').querySelectorAll('button[data-appr]').forEach((b) => {
          b.onclick = async () => {
            try {
              await api('/api/admin/approvals', {
                method: 'POST',
                body: { employeeRef: ref, day: b.dataset.d, status: b.dataset.appr },
              });
              toast(b.dataset.appr === 'approved' ? 'Approved' : 'Rejected');
              const cur = mine.get(b.dataset.d) || { day: b.dataset.d };
              cur.approvalStatus = b.dataset.appr;
              mine.set(b.dataset.d, cur);
              render();
            } catch (e) { toast(e.message, true); }
          };
        });
        window.scrollTo({ top: 0 });
      };
      render();
    }

    // ==================== PEOPLE ====================
    // Who is enrolled, as what, at what rate, and which job types they may pick.
    // The job-type catalog lives here too — it is only ever useful next to the
    // people you assign it to.
    VIEWS.people = async () => {
      const resp = await apiFull('/api/admin/members');
      const rows = resp.data || [];
      const catalog = await api('/api/admin/work-types').catch(() => []);
      const d = resp.diag;
      const banner = (rows.length === 0 && d && d.error)
        ? `<div class="card" style="border-color:var(--danger)">
            <h2 style="color:var(--danger)">${ic('inbox')} Couldn’t load your roster</h2>
            <div>${esc(d.error)}</div>
            <div class="muted" style="font-size:.72rem;margin-top:8px">backend: ${esc(d.apiBase)} · secret set: ${d.hasSecret} · workspace: ${esc(d.tenantId || '—')} · status: ${d.status == null ? '—' : d.status}</div>
          </div>` : '';

      $('view').innerHTML = banner + `<div class="card">
        <h2>${ic('users')} People</h2>
        <p class="lead">Everyone in your workspace. A role is what gives someone attendance at all — no role, no access. The pay rate drives the Timesheets totals.</p>
        ${rows.length ? `
        <div class="toolbar">
          <input class="search" id="tq" type="search" placeholder="Search name or email" autocomplete="off">
          <select id="trole">
            <option value="">All roles</option>
            <option value="manager">Manager</option>
            <option value="staff">Staff</option>
            <option value="none">No role (no access)</option>
          </select>
          ${catalog.length ? `<select id="tjob">
            <option value="">All job types</option>
            ${catalog.map((w) => `<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('')}
            <option value="__none">No job types assigned</option>
          </select>` : ''}
          <span class="count" id="tcount"></span>
        </div>
        <div id="tbody"></div>` : empty('users', 'No teammates found in your workspace roster.')}
      </div>
      <div class="card">
        <h2>${ic('briefcase')} Job types</h2>
        <p class="lead">What people can say they're here to do when they check in. Assign them per person above.</p>
        <div id="wtlist">${catalog.length
          ? `<div class="chips">${catalog.map((w) => `<span class="chip">${esc(w.name)}<button class="btn link" data-w="${esc(w.id)}" title="Remove" style="padding:0 2px;margin-left:2px">✕</button></span>`).join('')}</div>`
          : empty('briefcase', 'No job types yet — add your first below.')}</div>
        <div class="row" style="margin-top:12px">
          <input id="wtname" placeholder="e.g. Kitchen, Delivery, Front desk" style="flex:1;min-width:180px">
          <button class="btn primary" id="wtadd">Add</button>
        </div>
      </div>`;

      $('wtadd').onclick = async () => {
        const name = $('wtname').value.trim();
        if (!name) return toast('Enter a name', true);
        try { await api('/api/admin/work-types', { method: 'POST', body: { name } }); toast('Added'); go('people'); }
        catch (e) { toast(e.message, true); }
      };
      $('wtlist').querySelectorAll('button[data-w]').forEach((b) => b.onclick = async () => {
        try { await api('/api/admin/work-types/' + encodeURIComponent(b.dataset.w), { method: 'DELETE' }); toast('Removed'); go('people'); }
        catch (e) { toast(e.message, true); }
      });

      if (!rows.length) return;

      // Row ids stay keyed to each person's index in the FULL list, so filtering
      // only changes what is drawn — never which control belongs to whom.
      const rowHtml = (u, i) => {
        const ids = u.workTypeIds || [];
        const jobs = catalog.length
          ? catalog.map((w) => `<label class="wtchk"><input type="checkbox" data-wt="${i}" value="${esc(w.id)}" ${ids.includes(w.id) ? 'checked' : ''}> ${esc(w.name)}</label>`).join('')
          : '<span class="muted" style="font-size:.72rem">Add job types below to assign them.</span>';
        return `<tr>
          <td><div style="font-weight:600">${esc(u.name || u.email || u.employeeRef)}</div><div class="muted" style="font-size:.74rem">${esc(u.email || '')}</div></td>
          <td><select id="r${i}">
            <option value="" ${!u.role ? 'selected' : ''}>None</option>
            <option value="staff" ${u.role === 'staff' ? 'selected' : ''}>Staff</option>
            <option value="manager" ${u.role === 'manager' ? 'selected' : ''}>Manager</option>
          </select></td>
          <td><input id="p${i}" style="width:84px" type="number" min="0" step="0.5" value="${u.payRate == null ? '' : u.payRate}" placeholder="—"></td>
          <td><button class="btn small primary" id="s${i}">Save</button></td>
        </tr>
        <tr class="wtrow"><td colspan="4"><div class="muted" style="font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px">Job types</div><div class="wtwrap">${jobs}</div></td></tr>`;
      };

      const bind = (u, i) => {
        $('s' + i).onclick = async () => {
          const role = $('r' + i).value;
          const payRate = $('p' + i).value === '' ? null : Number($('p' + i).value);
          const workTypeIds = [...document.querySelectorAll('input[data-wt="' + i + '"]:checked')].map((c) => c.value);
          try {
            if (!role) { await api('/api/admin/members/' + encodeURIComponent(u.employeeRef), { method: 'DELETE' }); toast('Removed'); u.role = null; }
            else {
              await api('/api/admin/members', { method: 'POST', body: { employeeRef: u.employeeRef, role, payRate, name: u.name, email: u.email, workTypeIds } });
              toast('Saved');
              u.role = role; u.payRate = payRate; u.workTypeIds = workTypeIds;
            }
          } catch (e) { toast(e.message, true); }
        };
      };

      const render = () => {
        const qy = ($('tq').value || '').trim().toLowerCase();
        const role = $('trole').value;
        const job = $('tjob') ? $('tjob').value : '';
        const matches = rows.map((u, i) => [u, i]).filter(([u]) => {
          if (qy && !`${u.name || ''} ${u.email || ''} ${u.employeeRef}`.toLowerCase().includes(qy)) return false;
          if (role === 'none' ? !!u.role : role && u.role !== role) return false;
          if (job) {
            const ids = u.workTypeIds || [];
            if (job === '__none' ? ids.length > 0 : !ids.includes(job)) return false;
          }
          return true;
        });
        $('tcount').textContent = matches.length === rows.length
          ? `${rows.length} ${rows.length === 1 ? 'person' : 'people'}`
          : `${matches.length} of ${rows.length}`;
        $('tbody').innerHTML = matches.length
          ? `<table><thead><tr><th>Name</th><th>Role</th><th>Pay/hr</th><th></th></tr></thead><tbody>${matches.map(([u, i]) => rowHtml(u, i)).join('')}</tbody></table>`
          : empty('users', 'Nobody matches those filters.');
        matches.forEach(([u, i]) => bind(u, i));
      };
      $('tq').oninput = render;
      $('trole').onchange = render;
      if ($('tjob')) $('tjob').onchange = render;
      render();
    };

    // ==================== SETUP ====================
    // Configure-once things: where work happens, what a shift looks like, who is
    // expected when, and the timezone every day boundary depends on.
    VIEWS.setup = async () => {
      const [zones, templates, settings, members] = await Promise.all([
        api('/api/admin/zones'),
        api('/api/admin/templates').catch(() => []),
        api('/api/admin/settings').catch(() => ({ timezone: 'UTC' })),
        enrolled().catch(() => []),
      ]);
      const hasMap = typeof window.L !== 'undefined';
      const brk = (t) => (t.breakStart && t.breakEnd) ? ` · break ${t.breakStart}–${t.breakEnd}` : '';

      $('view').innerHTML = `
        <div class="card">
          <h2>${ic('pin')} Work zones</h2>
          <p class="lead">Where attendance counts. Phones check in and out automatically at the edge of these.</p>
          <div id="zlist">${zones.length ? `<table><thead><tr><th>Name</th><th>Radius</th><th>Centre</th><th></th></tr></thead><tbody>
            ${zones.map((z) => `<tr><td style="font-weight:600">${esc(z.name)}</td><td class="num">${Math.round(z.radiusM)} m</td>
            <td class="muted num">${z.lat.toFixed(4)}, ${z.lng.toFixed(4)}</td>
            <td><button class="btn link" style="color:var(--danger)" data-z="${esc(z.id)}">Remove</button></td></tr>`).join('')}</tbody></table>`
            : empty('pin', 'No zones yet — add your first below.')}</div>
          ${hasMap ? `<div id="zmap" style="margin-top:12px"></div>
            <div class="map-hint">Tap the map to place a zone, drag the teal dot to move it, drag the small white handle to resize.</div>` : ''}
          <div class="row" style="margin-top:8px">
            <input id="zn" placeholder="Zone name" style="flex:1;min-width:150px">
            <input id="zlat" placeholder="lat" style="width:110px">
            <input id="zlng" placeholder="lng" style="width:110px">
            <input id="zr" type="number" value="100" min="10" step="10" style="width:88px"><span class="muted">m</span>
            <button class="btn" id="zloc">Use my location</button>
            <button class="btn primary" id="zadd">Add zone</button>
          </div>
          <div id="zloc-msg" class="muted" style="font-size:.76rem;margin-top:8px"></div>
        </div>

        <div class="card">
          <h2>${ic('calendar')} Shift templates</h2>
          <p class="lead">Reusable shifts you can assign below. The break is optional and is taken off the expected hours.</p>
          <div id="tpllist">${templates.length
            ? `<table><thead><tr><th>Name</th><th>Shift</th><th>Hours</th><th></th></tr></thead><tbody>${templates.map((t) => `<tr>
                <td style="font-weight:600">${esc(t.name)}</td>
                <td class="num">${esc(t.startTime)}–${esc(t.endTime)}<span class="muted">${brk(t)}</span></td>
                <td class="num">${hrs(t.expectedMinutes)} h</td>
                <td><button class="btn link" style="color:var(--danger)" data-t="${esc(t.id)}">Remove</button></td></tr>`).join('')}</tbody></table>`
            : empty('calendar', 'No templates yet — create one below.')}</div>
          <div class="row" style="margin-top:12px;align-items:flex-end">
            <input id="tpn" placeholder="Template name" style="flex:1;min-width:130px">
            <label class="field">Start<input type="time" id="tps"></label>
            <label class="field">End<input type="time" id="tpe"></label>
            <label class="field">Break start<input type="time" id="tpbs"></label>
            <label class="field">Break end<input type="time" id="tpbe"></label>
            <button class="btn primary" id="tpadd">Add</button>
          </div>
        </div>

        <div class="card">
          <h2>${ic('calendar')} Expected hours</h2>
          <p class="lead">Optional. Set what a person is expected to work on a day and Timesheets will compare it against what they actually did.</p>
          <div class="row">
            <label class="field">Person<select id="sref">${members.map((m) => `<option value="${esc(m.employeeRef)}">${esc(m.name || m.employeeRef)}</option>`).join('') || '<option value="">No enrolled staff</option>'}</select></label>
            <label class="field">Day<input type="date" id="sday" value="${today()}"></label>
            <label class="field">Shift<select id="stpl"><option value="">Custom hours…</option>${templates.map((t) => `<option value="${esc(t.id)}">${esc(t.name)} (${hrs(t.expectedMinutes)}h)</option>`).join('')}</select></label>
            <label class="field" id="shrsField">Hours<input id="shrs" type="number" min="0" step="0.5" value="8" style="width:88px"></label>
            <button class="btn primary" id="ssave" style="align-self:flex-end">Assign</button>
          </div>
          <div id="slist" class="muted" style="margin-top:12px">Loading…</div>
        </div>

        <div class="card">
          <h2>${ic('sliders')} Workspace</h2>
          <label class="field" style="text-transform:none;letter-spacing:0;font-size:.8rem">Time zone — decides where one day ends and the next begins
            <input id="tz" value="${esc(settings.timezone || 'UTC')}" placeholder="e.g. America/Los_Angeles" style="max-width:280px;margin-top:4px"></label>
          <div style="margin-top:14px"><button class="btn primary" id="tzsave">Save</button></div>
        </div>

        <div class="card">
          <h2>${ic('bell')} What managers are told</h2>
          <p class="lead">Staff are always told about their own check-in and check-out — that one isn't optional, because the geofence can clock someone in without them touching their phone. This is about what reaches <em>you</em>.</p>
          <label class="wtchk" style="margin-bottom:12px"><input type="checkbox" id="rc">
            Ask a manager to confirm each check-in</label>
          <p class="muted" style="font-size:.76rem;margin:-6px 0 14px">
            When someone arrives you are asked “is this person here?”. Their clock
            starts either way — confirming only records who vouched for it. If a
            shift ends with nobody having answered, you and they are both told.
          </p>
          <label class="field" style="text-transform:none;letter-spacing:0;font-size:.8rem">Notify managers
