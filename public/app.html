            <select id="mn" style="max-width:320px;margin-top:4px">
              <option value="exceptions">Only what needs me — unconfirmed punches</option>
              <option value="all">Every check-in and check-out</option>
              <option value="off">Nothing</option>
            </select></label>
          <p class="muted" style="font-size:.76rem;margin:10px 0 0" id="mnhint"></p>
          <div style="margin-top:14px"><button class="btn primary" id="mnsave">Save</button></div>
        </div>`;

      // --- zones ---
      $('zlist').querySelectorAll('button[data-z]').forEach((b) => b.onclick = async () => {
        try { await api('/api/admin/zones/' + encodeURIComponent(b.dataset.z), { method: 'DELETE' }); toast('Removed'); go('setup'); }
        catch (e) { toast(e.message, true); }
      });
      if (hasMap) drawZoneMap(zones, [], { editable: true });
      $('zloc').onclick = () => {
        $('zloc-msg').textContent = 'Locating…';
        navigator.geolocation.getCurrentPosition(
          (p) => {
            const la = p.coords.latitude, ln = p.coords.longitude;
            $('zlat').value = la.toFixed(6); $('zlng').value = ln.toFixed(6);
            $('zloc-msg').textContent = 'Location set — adjust on the map if needed.';
            if (window.__zplace) window.__zplace(L.latLng(la, ln), true);
          },
          (e) => { $('zloc-msg').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
      };
      $('zadd').onclick = async () => {
        const name = $('zn').value.trim();
        const lat = Number($('zlat').value), lng = Number($('zlng').value);
        const radius = Math.max(10, Number($('zr').value) || 100);
        if (!name || !$('zlat').value || !$('zlng').value) return toast('Name + a point on the map are required', true);
        try { await api('/api/admin/zones', { method: 'POST', body: { name, lat, lng, radius } }); toast('Zone added'); go('setup'); }
        catch (e) { toast(e.message, true); }
      };

      // --- templates ---
      $('tpadd').onclick = async () => {
        const body = { name: $('tpn').value.trim(), startTime: $('tps').value, endTime: $('tpe').value, breakStart: $('tpbs').value || null, breakEnd: $('tpbe').value || null };
        if (!body.name || !body.startTime || !body.endTime) return toast('Name, start and end are required', true);
        try { await api('/api/admin/templates', { method: 'POST', body }); toast('Template added'); go('setup'); }
        catch (e) { toast(e.message, true); }
      };
      $('tpllist').querySelectorAll('button[data-t]').forEach((b) => b.onclick = async () => {
        try { await api('/api/admin/templates/' + encodeURIComponent(b.dataset.t), { method: 'DELETE' }); toast('Removed'); go('setup'); }
        catch (e) { toast(e.message, true); }
      });

      // --- expected hours ---
      const syncHrs = () => { $('shrsField').style.display = $('stpl').value ? 'none' : 'flex'; };
      $('stpl').onchange = syncHrs; syncHrs();
      const loadSchedules = async () => {
        const q = new URLSearchParams({ from: daysAgo(7), to: daysAgo(-21) });
        const rows = await api('/api/admin/schedules?' + q).catch(() => []);
        $('slist').innerHTML = rows.length
          ? `<table><thead><tr><th>Name</th><th>Day</th><th>Expected</th><th></th></tr></thead><tbody>
            ${rows.map((r) => `<tr><td>${esc(r.name || r.employeeRef)}</td><td>${esc(dateNice(r.day))}</td>
            <td class="num">${hrs(r.expectedMinutes)} h ${r.note ? `<span class="muted">· ${esc(r.note)}</span>` : ''}</td>
            <td><button class="btn link" data-e="${esc(r.employeeRef)}" data-d="${r.day}">Remove</button></td></tr>`).join('')}</tbody></table>`
          : empty('calendar', 'Nothing scheduled in the next few weeks.');
        $('slist').querySelectorAll('button[data-e]').forEach((b) => b.onclick = async () => {
          try { await api('/api/admin/schedules/' + encodeURIComponent(b.dataset.e) + '/' + b.dataset.d, { method: 'DELETE' }); toast('Removed'); loadSchedules(); }
          catch (e) { toast(e.message, true); }
        });
      };
      $('ssave').onclick = async () => {
        if (!$('sref').value) return toast('No staff to schedule', true);
        const body = { employeeRef: $('sref').value, day: $('sday').value };
        if ($('stpl').value) body.templateId = $('stpl').value;
        else body.expectedHours = Number($('shrs').value) || 0;
        try { await api('/api/admin/schedules', { method: 'POST', body }); toast('Assigned'); loadSchedules(); }
        catch (e) { toast(e.message, true); }
      };
      loadSchedules();

      // --- workspace ---
      $('tzsave').onclick = async () => {
        try { await api('/api/admin/settings', { method: 'PUT', body: { timezone: $('tz').value.trim() || 'UTC' } }); toast('Saved'); }
        catch (e) { toast(e.message, true); }
      };

      // --- manager notifications ---
      // Say out loud what each choice will cost in notifications per day, using
      // this workspace's own headcount. "Every check-in and check-out" sounds
      // reasonable in the abstract and is the setting most likely to get all
      // attendance notifications muted — the number is what makes that concrete
      // BEFORE it is chosen rather than a week later.
      const mnSel = $('mn');
      mnSel.value = settings.managerNotify || 'exceptions';
      $('rc').checked = settings.requireConfirmation !== false;
      const staffCount = (members || []).filter((m) => m.role).length;
      const mnHint = () => {
        const n = staffCount * 2;
        $('mnhint').textContent = mnSel.value === 'all'
          ? `About ${n || 'dozens of'} notifications a day, every working day — one per punch from ${staffCount || 'every'} enrolled ${staffCount === 1 ? 'person' : 'people'}.`
          : mnSel.value === 'off'
            ? 'You will hear nothing — including when a punch cannot be confirmed. Timesheets still record everything.'
            : 'Only punches where the location could not be confirmed. Usually a handful a week.';
      };
      mnHint();
      mnSel.onchange = mnHint;
      $('mnsave').onclick = async () => {
        try {
          await api('/api/admin/settings', { method: 'PUT', body: {
            managerNotify: mnSel.value,
            requireConfirmation: $('rc').checked,
          } });
          toast('Saved');
        } catch (e) { toast(e.message, true); }
      };
    };

    // ---- The zone map, shared by Today (read-only) and Setup (editable) -----
    // One implementation with two modes, so the two screens can never drift into
    // drawing the same zones differently.
    function drawZoneMap(zones, people, { editable }) {
      const el = $('zmap');
      if (!el || typeof window.L === 'undefined') return;
      const map = L.map('zmap');
      window.__zmap = map;
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

      const pts = [];
      zones.forEach((z) => {
        L.circle([z.lat, z.lng], { radius: z.radiusM, color: '#8aa0a8', weight: 1, fillOpacity: .08 }).addTo(map).bindTooltip(z.name);
        pts.push([z.lat, z.lng]);
      });

      // Co-located people hide each other: a whole team at one office would draw
      // as ONE dot, which is the exact case this map exists for.
      //
      // Cluster by real DISTANCE, not by rounding coordinates to a grid — a grid
      // puts a hard edge through the middle of an office, so two people standing
      // together can land in different cells and never get separated while still
      // overlapping on screen.
      //
      // Each cluster is fanned onto a ring around its centroid. That is a
      // DISPLAY offset only: the accuracy circle stays on the true position.
      const CLUSTER_M = 30;
      const groups = [];
      (people || []).forEach((p) => {
        const here = L.latLng(p.lastLocation.lat, p.lastLocation.lng);
        const near = groups.find((g) => g.some((q) =>
          here.distanceTo(L.latLng(q.lastLocation.lat, q.lastLocation.lng)) <= CLUSTER_M));
        if (near) near.push(p); else groups.push([p]);
      });
      const centroid = (g) => [
        g.reduce((s, q) => s + q.lastLocation.lat, 0) / g.length,
        g.reduce((s, q) => s + q.lastLocation.lng, 0) / g.length,
      ];
      const fanned = (group, i) => {
        const n = group.length;
        if (n < 2) return [group[0].lastLocation.lat, group[0].lastLocation.lng];
        const [cLat, cLng] = centroid(group);
        const ringM = Math.max(14, 5 * n);
        const a = (2 * Math.PI * i) / n;
        return [
          cLat + (ringM * Math.cos(a)) / 111320,
          cLng + (ringM * Math.sin(a)) / ((111320 * Math.cos(cLat * Math.PI / 180)) || 1),
        ];
      };
      const personIcon = (isIn) => L.divIcon({
        className: '', html: `<div class="ppin${isIn ? ' in' : ''}"></div>`,
        iconSize: [14, 14], iconAnchor: [7, 7],
      });
      groups.forEach((group) => {
        group.forEach((p, i) => {
          const loc = p.lastLocation;
          const truth = [loc.lat, loc.lng];
          if (loc.accuracyM) {
            L.circle(truth, {
              radius: Math.max(loc.accuracyM, 8),
              color: p.checkedIn ? '#159a63' : '#8aa0a8',
              weight: 1, fillOpacity: .07, interactive: false,
            }).addTo(map);
          }
          const detail = [
            p.checkedIn ? 'On the clock' : 'Checked out',
            `last fix ${timeOf(loc.at)}`,
            loc.zoneName ? esc(loc.zoneName) : null,
            loc.distanceM != null ? `${metres(loc.distanceM)} from centre` : null,
            p.verification !== 'verified' ? (VERIFY[p.verification] || {}).label : null,
            group.length > 1 ? `${group.length} people within ${CLUSTER_M} m — dots spread apart to stay readable` : null,
          ].filter(Boolean).join(' · ');
          L.marker(fanned(group, i), { icon: personIcon(p.checkedIn) })
            .addTo(map)
            .bindTooltip(`<strong>${esc(p.name || p.employeeRef)}</strong><br>${detail}`, { direction: 'top' });
          pts.push(truth);
        });
      });

      if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 }); else map.setView([20, 0], 2);
      setTimeout(() => map.invalidateSize(), 0);
      if (!editable) return;

      // Placement + resize handles (Setup only).
      let pin = null, ring = null, handle = null;
      const radiusVal = () => Math.max(10, Number($('zr').value) || 100);
      const eastEdge = (c, r) => L.latLng(c.lat, c.lng + r / ((111320 * Math.cos(c.lat * Math.PI / 180)) || 1));
      const pinIcon = L.divIcon({ className: '', html: '<div class="zpin"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
      const handleIcon = L.divIcon({ className: '', html: '<div class="zhandle"></div>', iconSize: [14, 14], iconAnchor: [7, 7] });
      const syncInputs = () => { const c = pin.getLatLng(); $('zlat').value = c.lat.toFixed(6); $('zlng').value = c.lng.toFixed(6); };
      const place = (latlng, fly) => {
        const r = radiusVal();
        if (!pin) {
          pin = L.marker(latlng, { draggable: true, icon: pinIcon }).addTo(map);
          ring = L.circle(latlng, { radius: r, color: ZONE_RING, weight: 2, fillColor: ZONE_RING, fillOpacity: .12 }).addTo(map);
          handle = L.marker(eastEdge(latlng, r), { draggable: true, icon: handleIcon }).addTo(map);
          pin.on('drag', () => { const c = pin.getLatLng(); ring.setLatLng(c); handle.setLatLng(eastEdge(c, ring.getRadius())); syncInputs(); });
          handle.on('drag', () => { const nr = Math.max(10, Math.round(pin.getLatLng().distanceTo(handle.getLatLng()))); ring.setRadius(nr); $('zr').value = nr; });
        } else { pin.setLatLng(latlng); ring.setLatLng(latlng).setRadius(r); handle.setLatLng(eastEdge(latlng, r)); }
        syncInputs();
        if (fly) map.setView(latlng, Math.max(map.getZoom(), 16));
      };
      map.on('click', (e) => place(e.latlng));
      $('zr').oninput = () => { if (ring) { ring.setRadius(radiusVal()); handle.setLatLng(eastEdge(pin.getLatLng(), radiusVal())); } };
      const fromInputs = () => {
        const la = Number($('zlat').value), ln = Number($('zlng').value);
        if ($('zlat').value && $('zlng').value && !isNaN(la) && !isNaN(ln)) place(L.latLng(la, ln), true);
      };
      $('zlat').onchange = fromInputs; $('zlng').onchange = fromInputs;
      window.__zplace = place;
    }

    // ---- Host ↔ plugin session bridge ----
    window.addEventListener('message', (ev) => {
      const msg = ev.data || {};
      if (msg.type === 'eesa:session' && msg.token) {
        if (msg.theme) applyTheme(msg.theme);
        TOKEN = msg.token;
        boot();
      }
    });
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'eesa:plugin-ready', plugin: 'attendance' }, '*');
    }
  </script>
</body>
</html>
