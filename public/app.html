          : empty('briefcase', 'No job types yet — add your first below.')}</div>
        <div class="row" style="margin-top:12px">
          <input id="wtname" placeholder="e.g. Kitchen, Delivery, Front desk" style="flex:1;min-width:180px">
          <button class="btn primary" id="wtadd">Add</button>
        </div>
      </details>`;

      $('wtadd').onclick = async () => {
        const name = $('wtname').value.trim();
        if (!name) return toast('Enter a name', true);
        try { await api('/api/admin/work-types', { method: 'POST', body: { name } }); toast('Added'); go('setup'); }
        catch (e) { toast(e.message, true); }
      };
      $('wtlist').querySelectorAll('button[data-w]').forEach((b) => b.onclick = async () => {
        try { await api('/api/admin/work-types/' + encodeURIComponent(b.dataset.w), { method: 'DELETE' }); toast('Removed'); go('setup'); }
        catch (e) { toast(e.message, true); }
      });

      if (!rows.length) return;

      // Row ids stay keyed to each person's index in the FULL list, so filtering
      // only changes what is drawn — never which control belongs to whom.
      // Whether this person's phone can record their hours with nobody touching
      // it — and if not, why, in words to pass on, with a Nudge that does.
      const phoneCell = (u, i) => {
        if (!u.attendanceRole || !('device' in u)) return '';
        const dv = u.device;
        if (dv && dv.ready) return '<span class="pill approved">Ready</span>';
        return `<span class="pill pending">Not ready</span>
          <div class="muted" style="font-size:.72rem;margin-top:4px;max-width:220px">${esc(dv ? dv.reason : 'Eesa AI hasn’t been opened on a phone yet')}</div>
          <button class="btn link" data-nudge="${i}" type="button" style="padding:2px 0;font-size:.78rem">Nudge</button>`;
      };

      const rowHtml = (u, i) => {
        const ids = u.workTypeIds || [];
        const jobs = catalog.map((w) => `<label class="wtchk"><input type="checkbox" data-wt="${i}" value="${esc(w.id)}" ${ids.includes(w.id) ? 'checked' : ''}> ${esc(w.name)}</label>`).join('');
        return `<tr>
          <td><div style="font-weight:600">${esc(u.name || u.email || u.employeeRef)}</div><div class="muted" style="font-size:.74rem">${esc(u.email || '')}</div></td>
          <td>${u.attendanceRole === 'admin' ? '<span class="pill approved">Admin</span>' : u.attendanceRole === 'staff' ? '<span class="pill complete">Staff</span>' : '<span class="muted" style="font-size:.78rem">No attendance</span>'}</td>
          <td>${phoneCell(u, i)}</td>
          ${u.attendanceRole ? `<td><input id="p${i}" style="width:84px" type="number" min="0" step="0.5" value="${u.payRate == null ? '' : u.payRate}" placeholder="—"></td>
          <td><button class="btn small primary" id="s${i}">Save</button></td>` : '<td></td><td></td>'}
        </tr>
        ${u.attendanceRole && catalog.length ? `<tr class="wtrow"><td colspan="5"><div class="muted" style="font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px">Job types</div><div class="wtwrap">${jobs}</div></td></tr>` : ''}`;
      };

      const bind = (u, i) => {
        if (!$('s' + i)) return;
        $('s' + i).onclick = async () => {
          const role = u.role || (u.attendanceRole === 'admin' ? 'manager' : 'staff');
          const payRate = $('p' + i).value === '' ? null : Number($('p' + i).value);
          const workTypeIds = [...document.querySelectorAll('input[data-wt="' + i + '"]:checked')].map((c) => c.value);
          try {
            await api('/api/admin/members', { method: 'POST', body: { employeeRef: u.employeeRef, role, payRate, name: u.name, email: u.email, workTypeIds } });
            toast('Saved');
            u.role = role; u.payRate = payRate; u.workTypeIds = workTypeIds;
          } catch (e) { toast(e.message, true); }
        };
      };

      const render = () => {
        const qy = ($('tq').value || '').trim().toLowerCase();
        const job = $('tjob') ? $('tjob').value : '';
        const matches = rows.map((u, i) => [u, i]).filter(([u]) => {
          if (qy && !`${u.name || ''} ${u.email || ''} ${u.employeeRef}`.toLowerCase().includes(qy)) return false;
          if (job) {
            const ids = u.workTypeIds || [];
            if (job === '__none' ? ids.length > 0 : !ids.includes(job)) return false;
          }
          return true;
        });
        $('tcount').textContent = matches.length === rows.length
          ? `${rows.length} ${rows.length === 1 ? 'person' : 'people'}`
          : `${matches.length} of ${rows.length}`;
        $('tbody').innerHTML = matches.length
          ? `<table><thead><tr><th>Name</th><th>Attendance</th><th>Phone</th><th>Pay/hr</th><th></th></tr></thead><tbody>${matches.map(([u, i]) => rowHtml(u, i)).join('')}</tbody></table>`
          : empty('users', 'Nobody matches those filters.');
        matches.forEach(([u, i]) => bind(u, i));
        $('tbody').querySelectorAll('button[data-nudge]').forEach((b) => b.onclick = async () => {
          const u = rows[Number(b.dataset.nudge)];
          b.disabled = true;
          try {
            await api(`/api/admin/members/${encodeURIComponent(u.employeeRef)}/nudge`, { method: 'POST' });
            b.textContent = 'Nudged';
            toast(`Nudged ${u.name || u.email}`);
          } catch (e) { b.disabled = false; toast(e.message, true); }
        });
      };
      $('tq').oninput = render;
      if ($('tjob')) $('tjob').onchange = render;
      render();
    }

    // ==================== SETUP ====================
    // Configure-once things: where work happens, what a shift looks like, who is
    // expected when, and the timezone every day boundary depends on.
    VIEWS.setup = async () => {
      const [zones, templates, settings, members] = await Promise.all([
        api('/api/admin/zones'),
        api('/api/admin/templates').catch(() => []),
        api('/api/admin/settings').catch(() => ({ timezone: 'UTC' })),
        enrolled().catch(() => []),
      ]);
      const hasMap = typeof window.L !== 'undefined';
      const brk = (t) => (t.breakStart && t.breakEnd) ? ` · break ${t.breakStart}–${t.breakEnd}` : '';

      $('view').innerHTML = `
        <div id="peoplepane"><div class="empty">Loading people…</div></div>

        <div class="card">
          <h2>${ic('pin')} Work zones</h2>
          <p class="lead">Where attendance counts. Phones check in and out automatically at the edge of these.</p>
          <div id="zlist">${zones.length ? `<table><thead><tr><th>Name</th><th>Radius</th><th>Centre</th><th></th></tr></thead><tbody>
            ${zones.map((z) => `<tr><td style="font-weight:600">${esc(z.name)}</td><td class="num">${Math.round(z.radiusM)} m</td>
            <td class="muted num">${z.lat.toFixed(4)}, ${z.lng.toFixed(4)}</td>
            <td><button class="btn link" style="color:var(--danger)" data-z="${esc(z.id)}">Remove</button></td></tr>`).join('')}</tbody></table>`
            : empty('pin', 'No zones yet — add your first below.')}</div>
          ${hasMap ? `<div id="zmap" style="margin-top:12px"></div>
            <div class="map-hint">Tap the map to place a zone, drag the teal dot to move it, drag the small white handle to resize.</div>` : ''}
          <div class="row" style="margin-top:8px">
            <input id="zn" placeholder="Zone name" style="flex:1;min-width:150px">
            <input id="zlat" placeholder="lat" style="width:110px">
            <input id="zlng" placeholder="lng" style="width:110px">
            <input id="zr" type="number" value="100" min="10" step="10" style="width:88px"><span class="muted">m</span>
            <button class="btn" id="zloc">Use my location</button>
            <button class="btn primary" id="zadd">Add zone</button>
          </div>
          <div id="zloc-msg" class="muted" style="font-size:.76rem;margin-top:8px"></div>
        </div>

        <details class="card fold">
          <summary>${ic('calendar')} Shift templates</summary>
          <p class="lead">Reusable shifts you can assign below. The break is optional and is taken off the expected hours.</p>
          <div id="tpllist">${templates.length
            ? `<table><thead><tr><th>Name</th><th>Shift</th><th>Hours</th><th></th></tr></thead><tbody>${templates.map((t) => `<tr>
                <td style="font-weight:600">${esc(t.name)}</td>
                <td class="num">${esc(t.startTime)}–${esc(t.endTime)}<span class="muted">${brk(t)}</span></td>
                <td class="num">${hrs(t.expectedMinutes)} h</td>
                <td><button class="btn link" style="color:var(--danger)" data-t="${esc(t.id)}">Remove</button></td></tr>`).join('')}</tbody></table>`
            : empty('calendar', 'No templates yet — create one below.')}</div>
          <div class="row" style="margin-top:12px;align-items:flex-end">
            <input id="tpn" placeholder="Template name" style="flex:1;min-width:130px">
            <label class="field">Start<input type="time" id="tps"></label>
            <label class="field">End<input type="time" id="tpe"></label>
            <label class="field">Break start<input type="time" id="tpbs"></label>
            <label class="field">Break end<input type="time" id="tpbe"></label>
            <button class="btn primary" id="tpadd">Add</button>
          </div>
        </details>

        <details class="card fold">
          <summary>${ic('calendar')} Expected hours</summary>
          <p class="lead">Optional. Set what a person is expected to work on a day and Timesheets will compare it against what they actually did.</p>
          <div class="row">
            <label class="field">Person<select id="sref">${members.map((m) => `<option value="${esc(m.employeeRef)}">${esc(m.name || m.employeeRef)}</option>`).join('') || '<option value="">No enrolled staff</option>'}</select></label>
            <label class="field">Day<input type="date" id="sday" value="${today()}"></label>
            <label class="field">Shift<select id="stpl"><option value="">Custom hours…</option>${templates.map((t) => `<option value="${esc(t.id)}">${esc(t.name)} (${hrs(t.expectedMinutes)}h)</option>`).join('')}</select></label>
            <label class="field" id="shrsField">Hours<input id="shrs" type="number" min="0" step="0.5" value="8" style="width:88px"></label>
            <button class="btn primary" id="ssave" style="align-self:flex-end">Assign</button>
          </div>
          <div id="slist" class="muted" style="margin-top:12px">Loading…</div>
        </details>

        <details class="card fold">
          <summary>${ic('sliders')} Workspace</summary>
          <label class="field" style="text-transform:none;letter-spacing:0;font-size:.8rem">Time zone — decides where one day ends and the next begins
            <input id="tz" value="${esc(settings.timezone || 'UTC')}" placeholder="e.g. America/Los_Angeles" style="max-width:280px;margin-top:4px"></label>
          <label class="field" style="text-transform:none;letter-spacing:0;font-size:.8rem;margin-top:14px">Working hours — managers' "people at work" box in the app shows during these, or while anyone is still checked in
            <span class="row" style="gap:8px;margin-top:4px;align-items:center">
              <input type="time" id="whs" value="${esc((settings.workingHours || {}).start || '07:00')}" style="max-width:140px">
              <span class="muted">to</span>
              <input type="time" id="whe" value="${esc((settings.workingHours || {}).end || '22:00')}" style="max-width:140px">
            </span></label>
          <div style="margin-top:14px"><button class="btn primary" id="tzsave">Save</button></div>
        </details>`;

      // --- zones ---
      $('zlist').querySelectorAll('button[data-z]').forEach((b) => b.onclick = async () => {
        try { await api('/api/admin/zones/' + encodeURIComponent(b.dataset.z), { method: 'DELETE' }); toast('Removed'); go('setup'); }
        catch (e) { toast(e.message, true); }
      });
      if (hasMap) drawZoneMap(zones, [], { editable: true });
      $('zloc').onclick = () => {
        $('zloc-msg').textContent = 'Locating…';
        navigator.geolocation.getCurrentPosition(
          (p) => {
            const la = p.coords.latitude, ln = p.coords.longitude;
            $('zlat').value = la.toFixed(6); $('zlng').value = ln.toFixed(6);
            $('zloc-msg').textContent = 'Location set — adjust on the map if needed.';
            if (window.__zplace) window.__zplace(L.latLng(la, ln), true);
          },
          (e) => { $('zloc-msg').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
      };
      $('zadd').onclick = async () => {
        const name = $('zn').value.trim();
        const lat = Number($('zlat').value), lng = Number($('zlng').value);
        const radius = Math.max(10, Number($('zr').value) || 100);
        if (!name || !$('zlat').value || !$('zlng').value) return toast('Name + a point on the map are required', true);
        try { await api('/api/admin/zones', { method: 'POST', body: { name, lat, lng, radius } }); toast('Zone added'); go('setup'); }
        catch (e) { toast(e.message, true); }
      };

      // --- templates ---
      $('tpadd').onclick = async () => {
        const body = { name: $('tpn').value.trim(), startTime: $('tps').value, endTime: $('tpe').value, breakStart: $('tpbs').value || null, breakEnd: $('tpbe').value || null };
        if (!body.name || !body.startTime || !body.endTime) return toast('Name, start and end are required', true);
        try { await api('/api/admin/templates', { method: 'POST', body }); toast('Template added'); go('setup'); }
        catch (e) { toast(e.message, true); }
      };
      $('tpllist').querySelectorAll('button[data-t]').forEach((b) => b.onclick = async () => {
        try { await api('/api/admin/templates/' + encodeURIComponent(b.dataset.t), { method: 'DELETE' }); toast('Removed'); go('setup'); }
        catch (e) { toast(e.message, true); }
      });

      // --- expected hours ---
      const syncHrs = () => { $('shrsField').style.display = $('stpl').value ? 'none' : 'flex'; };
      $('stpl').onchange = syncHrs; syncHrs();
      const loadSchedules = async () => {
        const q = new URLSearchParams({ from: daysAgo(7), to: daysAgo(-21) });
        const rows = await api('/api/admin/schedules?' + q).catch(() => []);
        $('slist').innerHTML = rows.length
          ? `<table><thead><tr><th>Name</th><th>Day</th><th>Expected</th><th></th></tr></thead><tbody>
            ${rows.map((r) => `<tr><td>${esc(r.name || r.employeeRef)}</td><td>${esc(dateNice(r.day))}</td>
            <td class="num">${hrs(r.expectedMinutes)} h ${r.note ? `<span class="muted">· ${esc(r.note)}</span>` : ''}</td>
            <td><button class="btn link" data-e="${esc(r.employeeRef)}" data-d="${r.day}">Remove</button></td></tr>`).join('')}</tbody></table>`
          : empty('calendar', 'Nothing scheduled in the next few weeks.');
        $('slist').querySelectorAll('button[data-e]').forEach((b) => b.onclick = async () => {
          try { await api('/api/admin/schedules/' + encodeURIComponent(b.dataset.e) + '/' + b.dataset.d, { method: 'DELETE' }); toast('Removed'); loadSchedules(); }
          catch (e) { toast(e.message, true); }
        });
      };
      $('ssave').onclick = async () => {
        if (!$('sref').value) return toast('No staff to schedule', true);
        const body = { employeeRef: $('sref').value, day: $('sday').value };
        if ($('stpl').value) body.templateId = $('stpl').value;
        else body.expectedHours = Number($('shrs').value) || 0;
        try { await api('/api/admin/schedules', { method: 'POST', body }); toast('Assigned'); loadSchedules(); }
        catch (e) { toast(e.message, true); }
      };
      loadSchedules();

      // --- workspace ---
      $('tzsave').onclick = async () => {
        try {
          await api('/api/admin/settings', { method: 'PUT', body: {
            timezone: $('tz').value.trim() || 'UTC', workStart: $('whs').value, workEnd: $('whe').value,
          } });
          toast('Saved');
        }
        catch (e) { toast(e.message, true); }
      };

      // --- people ---
      await renderPeople($('peoplepane'));
    };

    // ---- The zone map, shared by Today (read-only) and Setup (editable) -----
    // One implementation with two modes, so the two screens can never drift into
    // drawing the same zones differently.
    function drawZoneMap(zones, people, { editable }) {
      const el = $('zmap');
      if (!el || typeof window.L === 'undefined') return;
      const map = L.map('zmap');
      window.__zmap = map;
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

      const pts = [];
      zones.forEach((z) => {
        L.circle([z.lat, z.lng], { radius: z.radiusM, color: '#8aa0a8', weight: 1, fillOpacity: .08 }).addTo(map).bindTooltip(z.name);
        pts.push([z.lat, z.lng]);
      });

      // Co-located people hide each other: a whole team at one office would draw
      // as ONE dot, which is the exact case this map exists for.
      //
      // Cluster by real DISTANCE, not by rounding coordinates to a grid — a grid
      // puts a hard edge through the middle of an office, so two people standing
      // together can land in different cells and never get separated while still
      // overlapping on screen.
      //
      // Each cluster is fanned onto a ring around its centroid. That is a
      // DISPLAY offset only: the accuracy circle stays on the true position.
      const CLUSTER_M = 30;
      const groups = [];
      (people || []).forEach((p) => {
        const here = L.latLng(p.lastLocation.lat, p.lastLocation.lng);
        const near = groups.find((g) => g.some((q) =>
          here.distanceTo(L.latLng(q.lastLocation.lat, q.lastLocation.lng)) <= CLUSTER_M));
        if (near) near.push(p); else groups.push([p]);
      });
      const centroid = (g) => [
        g.reduce((s, q) => s + q.lastLocation.lat, 0) / g.length,
        g.reduce((s, q) => s + q.lastLocation.lng, 0) / g.length,
      ];
      const fanned = (group, i) => {
        const n = group.length;
        if (n < 2) return [group[0].lastLocation.lat, group[0].lastLocation.lng];
        const [cLat, cLng] = centroid(group);
        const ringM = Math.max(14, 5 * n);
        const a = (2 * Math.PI * i) / n;
        return [
          cLat + (ringM * Math.cos(a)) / 111320,
          cLng + (ringM * Math.sin(a)) / ((111320 * Math.cos(cLat * Math.PI / 180)) || 1),
        ];
      };
      const personIcon = (isIn) => L.divIcon({
        className: '', html: `<div class="ppin${isIn ? ' in' : ''}"></div>`,
        iconSize: [14, 14], iconAnchor: [7, 7],
      });
      groups.forEach((group) => {
        group.forEach((p, i) => {
          const loc = p.lastLocation;
          const truth = [loc.lat, loc.lng];
          if (loc.accuracyM) {
            L.circle(truth, {
              radius: Math.max(loc.accuracyM, 8),
              color: p.checkedIn ? '#159a63' : '#8aa0a8',
              weight: 1, fillOpacity: .07, interactive: false,
            }).addTo(map);
          }
          const detail = [
            p.checkedIn ? 'On the clock' : 'Checked out',
            `last fix ${timeOf(loc.at)}`,
            loc.zoneName ? esc(loc.zoneName) : null,
            loc.distanceM != null ? `${metres(loc.distanceM)} from centre` : null,
            p.verification !== 'verified' ? (VERIFY[p.verification] || {}).label : null,
            group.length > 1 ? `${group.length} people within ${CLUSTER_M} m — dots spread apart to stay readable` : null,
          ].filter(Boolean).join(' · ');
          L.marker(fanned(group, i), { icon: personIcon(p.checkedIn) })
            .addTo(map)
            .bindTooltip(`<strong>${esc(p.name || p.employeeRef)}</strong><br>${detail}`, { direction: 'top' });
          pts.push(truth);
        });
      });

      if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 }); else map.setView([20, 0], 2);
      setTimeout(() => map.invalidateSize(), 0);
      if (!editable) return;

      // Placement + resize handles (Setup only).
      let pin = null, ring = null, handle = null;
      const radiusVal = () => Math.max(10, Number($('zr').value) || 100);
      const eastEdge = (c, r) => L.latLng(c.lat, c.lng + r / ((111320 * Math.cos(c.lat * Math.PI / 180)) || 1));
      const pinIcon = L.divIcon({ className: '', html: '<div class="zpin"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
      const handleIcon = L.divIcon({ className: '', html: '<div class="zhandle"></div>', iconSize: [14, 14], iconAnchor: [7, 7] });
      const syncInputs = () => { const c = pin.getLatLng(); $('zlat').value = c.lat.toFixed(6); $('zlng').value = c.lng.toFixed(6); };
      const place = (latlng, fly) => {
        const r = radiusVal();
        if (!pin) {
          pin = L.marker(latlng, { draggable: true, icon: pinIcon }).addTo(map);
          ring = L.circle(latlng, { radius: r, color: ZONE_RING, weight: 2, fillColor: ZONE_RING, fillOpacity: .12 }).addTo(map);
          handle = L.marker(eastEdge(latlng, r), { draggable: true, icon: handleIcon }).addTo(map);
          pin.on('drag', () => { const c = pin.getLatLng(); ring.setLatLng(c); handle.setLatLng(eastEdge(c, ring.getRadius())); syncInputs(); });
          handle.on('drag', () => { const nr = Math.max(10, Math.round(pin.getLatLng().distanceTo(handle.getLatLng()))); ring.setRadius(nr); $('zr').value = nr; });
        } else { pin.setLatLng(latlng); ring.setLatLng(latlng).setRadius(r); handle.setLatLng(eastEdge(latlng, r)); }
        syncInputs();
        if (fly) map.setView(latlng, Math.max(map.getZoom(), 16));
      };
      map.on('click', (e) => place(e.latlng));
      $('zr').oninput = () => { if (ring) { ring.setRadius(radiusVal()); handle.setLatLng(eastEdge(pin.getLatLng(), radiusVal())); } };
      const fromInputs = () => {
        const la = Number($('zlat').value), ln = Number($('zlng').value);
        if ($('zlat').value && $('zlng').value && !isNaN(la) && !isNaN(ln)) place(L.latLng(la, ln), true);
      };
      $('zlat').onchange = fromInputs; $('zlng').onchange = fromInputs;
      window.__zplace = place;
    }

    // ---- Host ↔ plugin session bridge ----
    window.addEventListener('message', (ev) => {
      const msg = ev.data || {};
      if (msg.type === 'eesa:session' && msg.token) {
        if (msg.theme) applyTheme(msg.theme);
        TOKEN = msg.token;
        boot();
      }
    });
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'eesa:plugin-ready', plugin: 'attendance' }, '*');
    }
  </script>
</body>
</html>
