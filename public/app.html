<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attendance</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <script src="/vendor/leaflet/leaflet.js"></script>
  <style>
    /* ---- Theme tokens. Light is the base; dark applies when the host asks
           (data-theme="dark") or, before the host message arrives, when the OS
           prefers dark. The host (Flutter/React) sends the phone's theme over
           the postMessage bridge, so the plugin always matches the app. ---- */
    /* ---- Eesa's own palette, value for value.
       These are not "a teal that goes with Eesa" — they are the exact tokens
       from the app's AppColors, so the plugin embedded in the Eesa shell is the
       same colour as the screen it opened from. Eesa's brand accent is PURPLE
       (#5B2BD6 light / #9C6BF5 dark); this UI had been painting itself teal,
       which is why it read as somebody else's app. ---- */
    :root {
      color-scheme: light dark;
      --bg:#FCFCFC;
      --grad: radial-gradient(1100px 460px at 50% -160px, rgba(91,43,214,.10), transparent 72%);
      --card:#FFFFFF; --card-2:#F2F6F8; --line:#E2E5E8;
      --ink:#090E12; --muted:#5D646A; --faint:#8A9197;
      --primary:#5B2BD6; --primary-ink:#FCFCFC; --primary-weak:rgba(91,43,214,.10);
      --success:#00A461; --success-weak:rgba(0,164,97,.13);
      --warn:#E68D00; --warn-weak:rgba(230,141,0,.15);
      --danger:#DF2225; --danger-weak:rgba(223,34,37,.12);
      --shadow:0 1px 2px rgba(9,14,18,.05), 0 10px 30px rgba(9,14,18,.06);
      --radius:16px; --radius-sm:11px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#090D0F;
        --grad: radial-gradient(1100px 460px at 50% -160px, rgba(156,107,245,.14), transparent 72%);
        --card:#121518; --card-2:#181C1F; --line:#1F2326;
        --ink:#F3F5F7; --muted:#8C9399; --faint:#6B7278;
        --primary:#9C6BF5; --primary-ink:#05080B; --primary-weak:rgba(156,107,245,.16);
        --success:#00BD79; --success-weak:rgba(0,189,121,.16);
        --warn:#FBA100; --warn-weak:rgba(251,161,0,.16);
        --danger:#DF2225; --danger-weak:rgba(223,34,37,.18);
        --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.34);
      }
    }
    :root[data-theme="dark"] {
      --bg:#090D0F;
      --grad: radial-gradient(1100px 460px at 50% -160px, rgba(156,107,245,.14), transparent 72%);
      --card:#121518; --card-2:#181C1F; --line:#1F2326;
      --ink:#F3F5F7; --muted:#8C9399; --faint:#6B7278;
      --primary:#9C6BF5; --primary-ink:#05080B; --primary-weak:rgba(156,107,245,.16);
      --success:#00BD79; --success-weak:rgba(0,189,121,.16);
      --warn:#FBA100; --warn-weak:rgba(251,161,0,.16);
      --danger:#DF2225; --danger-weak:rgba(223,34,37,.18);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.34);
    }

    * { box-sizing: border-box; }
    html, body { height:100%; }
    body {
      margin:0; color:var(--ink);
      background:var(--grad), var(--bg); background-attachment:fixed;
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    .ic { width:1em; height:1em; flex:none; vertical-align:-.12em; }

    /* Header */
    header {
      position:sticky; top:0; z-index:5;
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:14px 18px; background:color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);
    }
    .brand { display:flex; align-items:center; gap:10px; font-weight:750; letter-spacing:-.01em; }
    .brand .logo {
      width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
      background:var(--primary); color:var(--primary-ink); font-size:1rem;
    }
    .brand h1 { font-size:1.02rem; margin:0; font-weight:750; }
    .whochip { display:flex; align-items:center; gap:9px; }
    .whochip .avatar {
      width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
      background:var(--primary-weak); color:var(--primary); font-weight:700; font-size:.82rem;
    }
    .whochip .meta { text-align:right; line-height:1.15; }
    .whochip .nm { font-size:.82rem; font-weight:650; }
    .whochip .rl { font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }

    /* Nav */
    nav { display:flex; gap:7px; padding:12px 14px 4px; overflow-x:auto; scrollbar-width:none; }
    nav::-webkit-scrollbar { display:none; }
    nav button {
      display:inline-flex; align-items:center; gap:7px; white-space:nowrap; cursor:pointer;
      background:var(--card); border:1px solid var(--line); color:var(--muted);
      padding:8px 14px; border-radius:999px; font-size:.83rem; font-weight:600;
      transition:all .15s ease; box-shadow:var(--shadow);
    }
    nav button:hover { color:var(--ink); }
    nav button.active { background:var(--primary); color:var(--primary-ink); border-color:transparent; }
    nav button .ic { width:15px; height:15px; }

    main { padding:14px 16px 40px; max-width:860px; margin:0 auto; }
    .fade { animation:fade .28s ease; }
    @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

    /* Cards */
    .card {
      background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
    }
    .card > h2 {
      margin:0 0 12px; font-size:.72rem; color:var(--muted);
      text-transform:uppercase; letter-spacing:.08em; font-weight:700;
      display:flex; align-items:center; gap:7px;
    }
    .card > h2 .ic { color:var(--primary); width:15px; height:15px; }
    .lead { margin:0 0 12px; color:var(--muted); font-size:.86rem; line-height:1.45; }

    /* Hero (staff status) */
    .hero {
      position:relative; overflow:hidden; border-radius:var(--radius);
      padding:22px; margin-bottom:14px; border:1px solid var(--line);
      background:var(--card); box-shadow:var(--shadow);
    }
    /* Deliberately quiet, matching the native My attendance screen: a filled
       dot for state, then the number, then one sentence. The green slab this
       replaced shouted the LEAST useful part — that you are on the clock,
       which the person already knows — over the part they opened it for. */
    .hero--on { background:var(--card); }
    .hero__top { display:flex; align-items:center; gap:8px; }
    .hero__badge {
      width:9px; height:9px; border-radius:50%; flex:0 0 auto;
      background:var(--faint);
    }
    .hero--on .hero__badge { background:var(--success); }
    .hero__state {
      font-size:.86rem; font-weight:700; letter-spacing:.01em; line-height:1.2;
      color:var(--muted);
    }
    .hero--on .hero__state { color:var(--success); }
    .hero__sub { font-size:.9rem; color:var(--muted); margin-top:12px; }
    .hero--on .stat, .hero .stat { background:var(--card-2); }
    .stats { display:flex; gap:10px; margin-top:18px; }
    .stat { flex:1; border-radius:var(--radius-sm); padding:12px 14px; background:var(--card-2); }
    .hero--on .stat { background:rgba(255,255,255,.14); }
    .stat__num { font-size:1.35rem; font-weight:800; letter-spacing:-.02em; }
    .stat__lbl { font-size:.68rem; opacity:.82; text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
    .pulse { width:9px; height:9px; border-radius:50%; background:#fff; box-shadow:0 0 0 0 rgba(255,255,255,.7); animation:pulse 1.8s infinite; display:inline-block; margin-left:8px; vertical-align:middle; }
    @keyframes pulse { 70% { box-shadow:0 0 0 9px rgba(255,255,255,0); } 100% { box-shadow:0 0 0 0 rgba(255,255,255,0); } }

    /* Tables */
    table { width:100%; border-collapse:collapse; font-size:.86rem; }
    thead th {
      text-align:left; padding:8px 10px; color:var(--faint); font-weight:700;
      font-size:.68rem; text-transform:uppercase; letter-spacing:.05em;
      border-bottom:1px solid var(--line);
    }
    tbody td { padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr { transition:background .12s; }
    tbody tr:hover { background:var(--card-2); }
    .num { font-variant-numeric:tabular-nums; }

    /* Chips */
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); font-size:.82rem; }
    .chip .ic { color:var(--primary); width:15px; height:15px; }

    .muted { color:var(--muted); }
    .err { color:var(--danger); }
    .ok { color:var(--success); }
    .empty { text-align:center; color:var(--muted); padding:26px 10px; font-size:.88rem; }
    .empty .ic { width:26px; height:26px; opacity:.5; display:block; margin:0 auto 8px; }

    /* Inputs / buttons */
    input, select {
      font:inherit; font-size:.86rem; padding:9px 11px; border-radius:10px;
      border:1px solid var(--line); background:var(--card-2); color:var(--ink); width:100%;
    }
    input:focus, select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-weak); }
    .btn {
      font:inherit; font-size:.85rem; font-weight:650; padding:9px 14px; border-radius:10px;
      border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;
      display:inline-flex; align-items:center; gap:7px; transition:all .14s;
    }
    .btn:hover { border-color:var(--primary); }
    .btn.primary { background:var(--primary); color:var(--primary-ink); border-color:transparent; }
    .btn.primary:hover { filter:brightness(1.06); }
    .btn.small { padding:6px 10px; font-size:.78rem; }
    .btn.link { background:transparent; border:none; color:var(--primary); padding:4px 6px; font-weight:650; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .field { display:flex; flex-direction:column; gap:5px; font-size:.72rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
    .field input, .field select { width:auto; text-transform:none; font-weight:400; letter-spacing:0; }

    .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:.72rem; font-weight:700; text-transform:capitalize; }
    .pill.pending, .pill.incomplete { background:var(--warn-weak); color:var(--warn); }
    .pill.open { background:var(--success-weak); color:var(--success); text-transform:none; }
    .pill.approved, .pill.complete { background:var(--success-weak); color:var(--success); }
    .pill.rejected { background:var(--danger-weak); color:var(--danger); }

    .toast {
      position:fixed; left:50%; bottom:22px; transform:translate(-50%,10px); z-index:50;
      background:var(--card); border:1px solid var(--line); padding:11px 16px; border-radius:12px;
      font-size:.86rem; font-weight:600; box-shadow:var(--shadow); opacity:0; pointer-events:none;
      transition:opacity .2s, transform .2s;
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .toast.err { border-color:var(--danger); color:var(--danger); }

    /* Zone map */
    #zmap { height:340px; border-radius:var(--radius-sm); border:1px solid var(--line); margin-bottom:10px; z-index:0; }
    #zmap .leaflet-container { background:var(--card-2); font:inherit; }
    :root[data-theme="dark"] #zmap .leaflet-tile,
    :root:not([data-theme="light"]) #zmap .leaflet-tile { filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9); }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) #zmap .leaflet-tile { filter:none; } }
    .zpin { width:16px; height:16px; box-sizing:border-box; border-radius:50%; background:var(--primary); border:2px solid #fff; box-shadow:0 0 0 1px var(--primary); cursor:grab; }
    .zhandle { width:14px; height:14px; box-sizing:border-box; border-radius:50%; background:#fff; border:2px solid var(--primary); cursor:ew-resize; }
    .map-hint { font-size:.74rem; color:var(--muted); margin:-2px 0 10px; }
    /* A person's last-known position on the zone map. Green = still checked in,
       grey = checked out, so "who is here now" reads at a glance. */
    .ppin { width:14px; height:14px; box-sizing:border-box; border-radius:50%; background:var(--muted); border:2px solid #fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.25); }
    .ppin.in { background:var(--success); }
    .legend { display:flex; flex-wrap:wrap; gap:12px; align-items:center; font-size:.74rem; color:var(--muted); margin:-2px 0 10px; }
    .legend .k { display:inline-flex; align-items:center; gap:5px; }
    .legend .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }

    /* Toolbars (search + filters above a table) */
    /* The one card that is asking for a decision. Given the warning tint rather
       than another neutral card so it reads as an inbox, not as more data. */
    .card.needs { border-color:var(--warn); box-shadow:0 0 0 1px var(--warn-weak) inset, var(--shadow); }
    .confirmrow { align-items:center; }
    .confirmbtns { display:flex; gap:6px; flex-shrink:0; }
    /* Two words on one line. "Not here" breaking after "Not" made the pair of
       buttons different heights and the row read as broken. */
    .confirmbtns .btn { white-space:nowrap; }
    @media (max-width:420px) {
      .confirmrow { flex-wrap:wrap; }
      .confirmbtns { width:100%; margin-top:8px; }
      .confirmbtns .btn { flex:1; }
    }
    /* Secondary tools, folded away until wanted. */
    details.fold > summary {
      cursor:pointer; font-weight:700; font-size:1rem; display:flex; align-items:center; gap:8px;
      list-style:none; color:var(--ink);
    }
    details.fold > summary::-webkit-details-marker { display:none; }
    details.fold > summary::after { content:'+'; margin-left:auto; color:var(--muted); font-weight:400; font-size:1.2rem; }
    details.fold[open] > summary::after { content:'−'; }
    details.fold > summary:focus-visible { outline:2px solid var(--primary); outline-offset:3px; }
    /* `hidden` must actually hide.
       An element carrying the hidden attribute was still laid out, because the
       UA rule [hidden]{display:none} loses to any class here that sets its own
       display — .toolbar{display:flex} did exactly that, so the custom date
       pickers stayed on screen underneath a selected preset. */
    [hidden] { display:none !important; }

    /* ---- Timesheets: one week, one row per person ---- */
    .weekbar { display:flex; align-items:center; gap:10px; margin:0 0 12px; }
    .weekbar .btn { min-width:38px; justify-content:center; }
    .weekbar .btn:disabled { opacity:.35; cursor:default; }
    .weeklbl { flex:1; text-align:center; line-height:1.25; }
    .weeklbl b { display:block; font-size:.95rem; }
    .weeklbl span { font-size:.76rem; color:var(--muted); }
    .tablewrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    /* One grid for the header and every person, so the days line up. On a phone
       the name and week total sit above the seven days, and the action below. */
    .wk { display:grid; grid-template-columns:minmax(96px,1.3fr) repeat(7, minmax(52px,1fr)) 76px 128px; gap:6px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:.8rem; }
    .wk.head { padding-top:0; font-size:.68rem; font-weight:650; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
    .wk .d { text-align:center; }
    .wk.head .d span { display:block; font-size:.82rem; color:var(--ink); letter-spacing:0; }
    .wk .who { font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .wk .tot { text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
    .wk .act { text-align:right; white-space:nowrap; }
    @media (max-width:640px) {
      .wk { grid-template-columns:repeat(7, 1fr); gap:4px; padding:12px 0; }
      .wk .who { grid-column:1 / 5; order:-2; font-size:.9rem; }
      .wk .tot { grid-column:5 / 8; order:-1; }
      .wk .act { grid-column:1 / -1; text-align:left; }
      .wk .act:empty { display:none; }
      .wk .act .btn { width:100%; justify-content:center; }
      .wk.head .who, .wk.head .tot, .wk.head .act { display:none; }
      .wk .cell { min-width:0; width:100%; padding:6px 1px; white-space:normal; line-height:1.15; font-size:.7rem; }
    }
    .cell {
      font:inherit; font-size:.74rem; font-weight:650; min-width:50px; padding:7px 4px;
      border-radius:9px; border:1px solid var(--line); background:var(--card-2); color:var(--ink);
      cursor:pointer; font-variant-numeric:tabular-nums; white-space:nowrap;
    }
    .cell:hover { border-color:var(--primary); }
    .cell.none { background:transparent; color:var(--faint); }
    .cell.fix { background:var(--warn-weak); border-color:var(--warn); color:var(--warn); }
    .cell.open { border-color:var(--success); }
    .cell.open::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--success); margin-right:4px; vertical-align:1px; }
    .cell:disabled { cursor:default; opacity:.35; border-color:transparent; }
    .cell.changed::after { content:'✎'; margin-left:3px; font-size:.85em; opacity:.6; }
    .legendrow { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.74rem; color:var(--muted); margin-top:12px; }
    .legendrow i { font-style:normal; display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; border:1px solid var(--line); }

    /* ---- Fix times: a sheet over the page ---- */
    .sheet-back { position:fixed; inset:0; z-index:60; background:rgba(9,14,18,.42); display:flex; align-items:flex-end; justify-content:center; }
    .sheet {
      background:var(--card); color:var(--ink); width:100%; max-width:520px; max-height:90vh; overflow:auto;
      border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow:var(--shadow);
    }
    @media (min-width:640px) { .sheet-back { align-items:center; } .sheet { border-radius:18px; } }
    .sheet h3 { margin:0; font-size:1.08rem; }
    .sheet .sub { color:var(--muted); font-size:.84rem; margin:2px 0 14px; }
    .sheet .times { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0 14px; }
    .sheet .evidence { background:var(--warn-weak); border-radius:10px; padding:10px 12px; font-size:.84rem; line-height:1.45; }
    .sheet .note { background:var(--card-2); border-radius:10px; padding:10px 12px; font-size:.82rem; color:var(--muted); }
    .sheet .acts { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:4px; }
    .sheet .acts .btn.primary { min-width:96px; justify-content:center; }
    .sheet details { margin-top:14px; }
    .sheet details summary { cursor:pointer; font-size:.82rem; color:var(--muted); font-weight:650; }
    .toast.act { pointer-events:auto; display:flex; gap:14px; align-items:center; }
    .toast.act .btn.link { padding:0; font-size:.86rem; }

    /* One segmented control, on one line — the shape Eesa uses for the same job,
       rather than a bag of pills that wraps to two rows and reads as clutter.
       It scrolls sideways instead of wrapping, so adding a period never changes
       the height of the screen. */
    .periods {
      display:flex; gap:2px; margin-bottom:8px;
      background:var(--card-2); border:1px solid var(--line);
      border-radius:11px; padding:3px;
      overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
    }
    .periods::-webkit-scrollbar { display:none; }
    .periods button {
      flex:1 0 auto; white-space:nowrap;
      background:transparent; border:none; color:var(--muted);
      border-radius:8px; padding:7px 12px; font-size:.8rem; font-weight:600;
      cursor:pointer; font-family:inherit;
    }
    .periods button:hover { color:var(--ink); }
    .periods button.active { background:var(--primary); color:var(--primary-ink); }
    .periods button:focus-visible { outline:2px solid var(--primary); outline-offset:-2px; }
    /* ---- Staff: one page, built the way iOS builds its own ----
       Inset grouped lists on the grouped background, the system type scale and
       colours, a segmented control, and a sheet for each question. The app bar
       above already says Attendance, so the page keeps no header or tabs. */
    :root {
      --ios-bg:#F2F2F7; --ios-cell:#FFFFFF; --ios-press:#D1D1D6; --ios-sep:rgba(60,60,67,.29);
      --ios-label:#000000; --ios-2:rgba(60,60,67,.6); --ios-3:rgba(60,60,67,.3);
      --ios-fill:rgba(118,118,128,.12); --ios-seg:#FFFFFF; --ios-scrim:rgba(0,0,0,.4);
      --ios-green:#34C759; --ios-red:#FF3B30; --ios-alert:#F2F2F2;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ios-bg:#000000; --ios-cell:#1C1C1E; --ios-press:#3A3A3C; --ios-sep:rgba(84,84,88,.65);
        --ios-label:#FFFFFF; --ios-2:rgba(235,235,245,.6); --ios-3:rgba(235,235,245,.3);
        --ios-fill:rgba(118,118,128,.24); --ios-seg:#636366; --ios-scrim:rgba(0,0,0,.6);
        --ios-green:#30D158; --ios-red:#FF453A; --ios-alert:#2C2C2E;
      }
    }
    :root[data-theme="dark"] {
      --ios-bg:#000000; --ios-cell:#1C1C1E; --ios-press:#3A3A3C; --ios-sep:rgba(84,84,88,.65);
      --ios-label:#FFFFFF; --ios-2:rgba(235,235,245,.6); --ios-3:rgba(235,235,245,.3);
      --ios-fill:rgba(118,118,128,.24); --ios-seg:#636366; --ios-scrim:rgba(0,0,0,.6);
      --ios-green:#30D158; --ios-red:#FF453A; --ios-alert:#2C2C2E;
    }
    body.staff {
      background:var(--ios-bg); color:var(--ios-label);
      font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      font-size:17px; letter-spacing:-.41px; -webkit-tap-highlight-color:transparent;
    }
    body.staff header, body.staff nav { display:none; }
    body.staff main { max-width:560px; padding:20px 16px 40px; }
    .ig { background:var(--ios-cell); border-radius:12px; overflow:hidden; margin:0 0 22px; }
    .cell {
      position:relative; display:flex; align-items:center; gap:12px; width:100%; min-height:44px;
      padding:11px 16px; margin:0; font:inherit; color:inherit; text-align:left; background:none; border:0;
    }
    .ig > .cell + .cell::before, .ig > .punches + .cell::before, .punches > .cell::before {
      content:''; position:absolute; top:0; left:16px; right:0; height:.5px; background:var(--ios-sep);
    }
    .punches > .cell { padding-left:32px; }
    .punches > .cell::before { left:32px; }
    button.cell { cursor:pointer; }
    button.cell:active { background:var(--ios-press); }
    button.cell:disabled { opacity:.5; cursor:default; }
    .cell:focus-visible { outline:2px solid var(--primary); outline-offset:-2px; }
    .cell__main { flex:1; min-width:0; }
    .cell__title { display:block; font-size:17px; line-height:22px; }
    .cell__sub { display:block; font-size:15px; line-height:20px; letter-spacing:-.24px; color:var(--ios-2); }
    .cell__detail { color:var(--ios-2); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .cell__label { flex:none; white-space:nowrap; }
    .cell__value { flex:1 1 auto; min-width:0; text-align:right; overflow:hidden; text-overflow:ellipsis; }
    .punches .cell__title { font-size:15px; line-height:20px; }
    .chev { width:8px; height:13px; flex:none; color:var(--ios-3); transition:transform .2s; }
    [aria-expanded="true"] > .chev { transform:rotate(90deg); }
    .state { font-weight:600; }
    .dot { width:10px; height:10px; border-radius:50%; flex:none; background:var(--ios-3); }
    .dot--in { background:var(--ios-green); }
    .zmark { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
    .zmark i { width:8px; height:8px; border-radius:50%; flex:none; }
    .sum { display:grid; grid-template-columns:repeat(3, 1fr); }
    .sum > div { position:relative; padding:10px 12px 12px; }
    .sum > div + div::before { content:''; position:absolute; left:0; top:12px; bottom:12px; width:.5px; background:var(--ios-sep); }
    .sum__l { font-size:13px; letter-spacing:-.08px; color:var(--ios-2); }
    .sum__n { margin-top:2px; font-family:ui-rounded, -apple-system, system-ui, sans-serif; font-size:22px; font-weight:700; letter-spacing:.35px; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; padding:2px; margin:0 0 22px; border-radius:9px; background:var(--ios-fill); }
    .seg button {
      font:inherit; font-size:13px; font-weight:500; letter-spacing:-.08px; white-space:nowrap;
      color:var(--ios-label); background:none; border:0; border-radius:7px; padding:6px 2px; cursor:pointer;
    }
    .seg button.active { background:var(--ios-seg); font-weight:600; box-shadow:0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }
    .seg button:focus-visible { outline:2px solid var(--primary); outline-offset:-2px; }
    .ihead { display:flex; justify-content:space-between; gap:8px; padding:0 16px 7px; font-size:13px; letter-spacing:-.08px; color:var(--ios-2); }
    .ihead span:first-child { text-transform:uppercase; }
    body.staff .cell input {
      font:inherit; font-size:17px; color:var(--ios-label); background:none; border:0; border-radius:0;
      padding:0; width:100%; box-shadow:none;
    }
    body.staff .cell input.when {
      -webkit-appearance:none; appearance:none; width:auto; min-width:0; background:var(--ios-fill);
      border-radius:6px; padding:6px 11px; font-variant-numeric:tabular-nums;
    }
    /* An action sheet for the question, and an alert when a reason is typed. */
    .iback { position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center; background:var(--ios-scrim); animation:ifade .2s ease; }
    .iback--center { align-items:center; padding:0 16px; }
    .ialert { width:270px; max-width:100%; overflow:hidden; text-align:center; border-radius:14px; background:var(--ios-alert); animation:ipop .2s ease-out; }
    .ialert__body { padding:19px 16px 16px; }
    .ialert h3 { margin:0; font-size:17px; font-weight:600; }
    .ialert p { margin:2px 0 0; font-size:13px; letter-spacing:-.08px; }
    body.staff .ialert input {
      width:100%; margin-top:14px; padding:7px 8px; font:inherit; font-size:13px; color:var(--ios-label);
      background:var(--ios-cell); border:.5px solid var(--ios-sep); border-radius:6px; box-shadow:none;
    }
    body.staff .ialert input:focus { outline:none; box-shadow:none; border-color:var(--ios-sep); }
    .ialert__acts { display:grid; grid-template-columns:1fr 1fr; border-top:.5px solid var(--ios-sep); }
    .ialert__acts button { min-height:44px; font:inherit; font-size:17px; color:var(--primary); background:none; border:0; cursor:pointer; }
    .ialert__acts button + button { border-left:.5px solid var(--ios-sep); font-weight:600; }
    .ialert__acts button:active { background:var(--ios-press); }
    .ialert__acts button:disabled { color:var(--ios-3); cursor:default; }
    .iaction { width:100%; max-width:560px; padding:0 8px calc(8px + env(safe-area-inset-bottom, 0px)); animation:iup .3s cubic-bezier(.2,.8,.2,1); }
    .iaction .ig { margin:0 0 8px; border-radius:14px; }
    .iaction .msg { padding:14px 16px; text-align:center; font-size:13px; letter-spacing:-.08px; color:var(--ios-2); }
    .iaction button { position:relative; display:block; width:100%; min-height:57px; font:inherit; font-size:20px; color:var(--primary); background:none; border:0; cursor:pointer; }
    .iaction .ig > * + button::before { content:''; position:absolute; top:0; left:0; right:0; height:.5px; background:var(--ios-sep); }
    .iaction button:active { background:var(--ios-press); }
    .iaction .danger { color:var(--ios-red); }
    .iaction .strong { font-weight:600; }
    @keyframes iup { from { transform:translateY(100%); } to { transform:none; } }
    @keyframes ifade { from { opacity:0; } to { opacity:1; } }
    @keyframes ipop { from { opacity:0; transform:scale(1.1); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) { .iback, .iaction, .ialert { animation:none; } .chev { transition:none; } }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    .toolbar input[type="search"], .toolbar input.search { flex:1; min-width:180px; }
    .toolbar select { width:auto; min-width:120px; }
    .count { font-size:.74rem; color:var(--muted); margin-left:auto; white-space:nowrap; }

    /* Event drill-down under a day row */
    .evt { display:flex; gap:10px; align-items:flex-start; padding:8px 0 8px 10px; border-left:2px solid var(--line); margin-left:6px; font-size:.8rem; }
    .evt .t { font-variant-numeric:tabular-nums; font-weight:650; width:62px; flex:none; }
    .evt .g { flex:1; min-width:0; }
    .tag { display:inline-block; padding:1px 7px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); font-size:.68rem; color:var(--muted); margin-left:6px; }
    a.maplink { color:var(--primary); text-decoration:none; font-weight:600; }
    a.maplink:hover { text-decoration:underline; }
    /* Per-user job-type picks */
    .wtwrap { display:flex; flex-wrap:wrap; gap:8px 16px; }
    .wtchk { display:inline-flex; align-items:center; gap:6px; font-size:.82rem; white-space:nowrap; }
    .wtchk input { width:auto; }
    tr.wtrow td { padding-top:2px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">✦</span>
      <h1>Attendance</h1>
    </div>
    <div class="whochip" id="who"><span class="muted" style="font-size:.82rem">connecting…</span></div>
  </header>
  <nav id="nav"></nav>
  <main id="view"><div class="empty">Loading…</div></main>
  <div class="toast" id="toast"></div>

  <script>
    let TOKEN = null, CTX = null, TAB = null, ME_TICK = null;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
    const hrs = (m) => (Number(m || 0) / 60).toFixed(1);
    // "0.0" for a 40-minute shift reads as a bug. Show hours only once there
    // is an hour to show, minutes below that, and a plain dash for nothing.
    const dur = (m) => {
      const n = Math.max(0, Math.round(Number(m || 0)));
      if (!n) return '—';
      if (n < 60) return n + 'm';
      const h = Math.floor(n / 60), r = n % 60;
      return r ? `${h}h ${r}m` : `${h}h`;
    };
    // The workplace's clock, not the browser's.
    //
    // Every timestamp here is an instant in UTC, and the day it belongs to was
    // decided on the server in the tenant's zone — so rendering the hour in
    // whatever zone the phone happens to be set to can show a shift at a time
    // belonging to a different day. A handset brought from India displayed an
    // 08:01 arrival in Anaheim as 20:31.
    //
    // TZ is set from the workspace settings once they load; until then the
    // browser's own zone is the best guess available.
    let TZ = null;
    const timeOf = (iso) => iso
      ? new Date(iso).toLocaleTimeString([], {
          hour: '2-digit', minute: '2-digit', ...(TZ ? { timeZone: TZ } : {}),
        })
      : '—';
    const dateNice = (s) => { if (!s) return '—'; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }); };
    const today = () => new Date().toISOString().slice(0, 10);
    const daysAgo = (n) => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);
    const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    // The restaurant's calendar and clock, whatever device is looking.
    const todayTZ = () => new Date().toLocaleDateString('en-CA', TZ ? { timeZone: TZ } : {});
    const addDaysYmd = (d, n) => { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10); };
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const WDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const ymdParts = (d) => d.split('-').map(Number);
    const wdayOf = (d) => { const [y, m, dd] = ymdParts(d); return new Date(Date.UTC(y, m - 1, dd)).getUTCDay(); };
    const dayLabel = (d) => { const [, m, dd] = ymdParts(d); return `${WDAYS[wdayOf(d)]} ${dd} ${MONTHS[m - 1]}`; };
    const rangeLabel = (f, t) => { const [, fm, fd] = ymdParts(f); const [, tm, td] = ymdParts(t); return fm === tm ? `${fd}–${td} ${MONTHS[tm - 1]}` : `${fd} ${MONTHS[fm - 1]} – ${td} ${MONTHS[tm - 1]}`; };
    // Monday to Sunday, `offset` weeks from this one.
    const weekRange = (offset = 0) => {
      const t = todayTZ(); const back = (wdayOf(t) + 6) % 7;
      const from = addDaysYmd(t, -back + offset * 7);
      return [from, addDaysYmd(from, 6)];
    };
    // "15:25" on the restaurant's clock, for a time input.
    const hmTZ = (iso) => iso ? new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', ...(TZ ? { timeZone: TZ } : {}) }) : '';
    // A wall-clock time on a restaurant day, as the instant it names.
    const zonedIso = (day, hm) => {
      const [y, m, d] = ymdParts(day); const [h, mi] = hm.split(':').map(Number);
      const guess = Date.UTC(y, m - 1, d, h, mi);
      const parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ || 'UTC', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).formatToParts(new Date(guess));
      const get = (k) => Number(parts.find((x) => x.type === k).value);
      const asUtc = Date.UTC(get('year'), get('month') - 1, get('day'), get('hour'), get('minute'));
      return new Date(guess - (asUtc - guess)).toISOString();
    };
    // What a manager needs to know about a day, in their words.
    const FLAG_TEXT = {
      no_check_out: 'No check-out — the shift never ended.',
      no_check_in: 'No check-in — a departure with no arrival before it.',
      over_12h: 'Over 12 hours — longer than any real shift.',
      left_later: 'Checked out by hand, but the phone saw them leave later.',
      changed: 'Changed by a manager.',
    };

    const initials = (s) => (String(s || '?').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('') || '?').toUpperCase();
    const metres = (m) => (m == null ? '' : m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1)} km`);
    const osm = (lat, lng) => `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=18/${lat}/${lng}`;

    // ---- Verification badges --------------------------------------------------
    // Whether a punch's location could be confirmed against its zone. This is a
    // MARKER, never a filter: unverified attendance is always shown, because it
    // is usually honest (no GPS indoors, an admin correction) and hiding it would
    // just look like lost time to the person who worked it.
    const VERIFY = {
      verified:   { label: 'Verified',   cls: 'approved', hint: 'Location confirmed inside the work zone.' },
      partial:    { label: 'Partly verified', cls: 'pending', hint: 'Some punches this day had no location to check.' },
      unverified: { label: 'Unverified', cls: 'pending', hint: 'No location was recorded, so the system could not confirm it. The record still counts.' },
      outside:    { label: 'Outside zone', cls: 'rejected', hint: 'Recorded outside the work zone.' },
    };

    const vbadge = (state, reason) => {
      const v = VERIFY[state];
      if (!v) return '';
      return `<span class="pill ${v.cls}" title="${esc(reason || v.hint)}">${esc(v.label)}</span>`;
    };

    // "Main Office · 34 m from centre (±8 m) · map" — where a punch happened,
    // always paired with a link so the admin can see it for themselves.
    // One mark per work zone: a coloured dot beside its name, the same colour
    // everywhere that zone is named, so a day spent at two places reads at a
    // glance. Keyed by name, because editing a zone makes a new one with the
    // same name.
    const ZONE_COLOURS = ['#0A84FF', '#FF9F0A', '#BF5AF2', '#30B0C7', '#FF375F', '#5E5CE6', '#AC8E68'];
    let ZONE_ORDER = [];
    const zoneColour = (name) => {
      const key = String(name || '').trim().toLowerCase();
      const at = ZONE_ORDER.indexOf(key);
      const i = at >= 0 ? at : [...key].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
      return ZONE_COLOURS[i % ZONE_COLOURS.length];
    };
    const zoneMark = (name) => (name
      ? `<span class="zmark"><i style="background:${zoneColour(name)}"></i>${esc(name)}</span>`
      : '');

    const whereText = (loc) => {
      if (!loc) return '<span class="muted">No location</span>';
      const bits = [];
      if (loc.zoneName) bits.push(zoneMark(loc.zoneName));
      if (loc.distanceM != null) bits.push(`${metres(loc.distanceM)} from centre`);
      if (loc.accuracyM != null) bits.push(`±${metres(loc.accuracyM)}`);
      const link = `<a class="maplink" target="_blank" rel="noopener" href="${osm(loc.lat, loc.lng)}">map</a>`;
      return `${bits.join(' · ') || `${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}`} · ${link}`;
    };

    // How a punch got recorded, in words the admin didn't have to learn.
    const SOURCE_LABEL = {
      geofence: 'Automatic (arrived/left zone)', banner: 'Tapped in the app',
      prompt: 'Answered the notification', manual: 'Logged by an admin', nfc: 'NFC tag',
    };

    // One punch as a timeline row: when, what, where, how it was recorded, and
    // whether the location checks out.
    const eventHtml = (e) => {
      const kind = e.type === 'check_in'
        ? (e.forWork === false ? 'On site — not for work' : 'Checked in')
        : 'Checked out';
      return `<div class="evt">
        <div class="t">${esc(timeOf(e.at))}</div>
        <div class="g">
          <div style="font-weight:650">${esc(kind)}${e.workType ? `<span class="tag">${esc(e.workType)}</span>` : ''} ${vbadge(e.verification, e.verificationReason)}</div>
          <div class="muted" style="font-size:.76rem;margin-top:3px">${whereText(e.location)}</div>
          <div class="muted" style="font-size:.72rem;margin-top:1px">${esc(SOURCE_LABEL[e.source] || e.source)}</div>
          ${e.note ? `<div style="font-size:.78rem;margin-top:3px">Reason: ${esc(e.note)}</div>` : ''}
        </div>
      </div>`;
    };

    // ---- inline icon set (stroke, currentColor) ----
    const ICONS = {
      download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
      bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      check: '<path d="M20 6L9 17l-5-5"/>',
      pin: '<path d="M12 21s-6-5.7-6-10a6 6 0 0 1 12 0c0 4.3-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
      user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
      users: '<circle cx="9" cy="8" r="3.4"/><path d="M2.6 21a6.4 6.4 0 0 1 12.8 0"/><path d="M16.2 5.6a3.4 3.4 0 0 1 0 6.6"/><path d="M18.4 21a6.4 6.4 0 0 0-3-5.4"/>',
      calendar: '<rect x="3" y="4.5" width="18" height="17" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
      chart: '<path d="M3 21h18"/><path d="M6.5 21v-6M12 21V6M17.5 21v-4"/>',
      sliders: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
      activity: '<path d="M3 12h4l3 8 4-16 3 8h4"/>',
      checkCircle: '<circle cx="12" cy="12" r="9"/><path d="M8.4 12.4l2.6 2.6 4.6-5.2"/>',
      history: '<path d="M3.2 12a8.8 8.8 0 1 0 2.8-6.4L3 8"/><path d="M3 3.5V8h4.5"/><path d="M12 8v4.2l3 1.8"/>',
      inbox: '<path d="M4 13l2.5-8h11L20 13"/><path d="M4 13h5l1 2h4l1-2h5v6H4z"/>',
      briefcase: '<rect x="3" y="7.5" width="18" height="13" rx="2"/><path d="M9 7.5V5.5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 12.5h18"/>',
    };
    // Read the live accent so map overlays follow the theme rather than
    // hard-coding a colour that only suits one of them.
    const ZONE_RING = getComputedStyle(document.documentElement)
      .getPropertyValue('--primary').trim() || '#5B2BD6';
    const ic = (n) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ICONS.clock}</svg>`;
    const empty = (icon, msg) => `<div class="empty">${ic(icon)}${esc(msg)}</div>`;

    let toastTimer;
    function toast(msg, isErr) {
      const t = $('toast'); t.textContent = msg; t.classList.toggle('err', !!isErr); t.classList.remove('act');
      t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
    }
    // A done action with a way back, instead of an "Are you sure?" before it.
    function toastUndo(msg, onUndo) {
      const t = $('toast');
      t.classList.remove('err'); t.classList.add('act', 'show');
      t.innerHTML = `<span>${esc(msg)}</span><button class="btn link" id="toastundo" type="button">Undo</button>`;
      $('toastundo').onclick = async () => { t.classList.remove('show', 'act'); await onUndo(); };
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show', 'act'), 7000);
    }

    // ---- theme: honor the host's light/dark (falls back to prefers-color-scheme) ----
    function applyTheme(t) {
      if (t === 'dark' || t === 'light') {
        document.documentElement.dataset.theme = t;
        if (window.__zmap) setTimeout(() => window.__zmap.invalidateSize(), 60);
      }
    }

    async function apiFull(path, { method = 'GET', body = null } = {}) {
      const opts = { method, headers: { Authorization: 'Bearer ' + TOKEN } };
      if (body != null) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const r = await fetch(path, opts);
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.ok === false) throw new Error((j.error && (j.error.message || j.error)) || ('HTTP ' + r.status));
      return j; // whole envelope: { ok, data, diag? }
    }
    const api = async (path, opts) => (await apiFull(path, opts)).data;

    const TABS = {
      today: ['Today', 'activity'], timesheets: ['Timesheets', 'chart'],
      people: ['People', 'users'], setup: ['Setup', 'sliders'],
      me: ['My attendance', 'user'],
    };
    // Two branches of one shell — the tab set is the only thing that differs.
    //
    // Four admin sections, grouped by the job being done. The previous eight
    // split a single question across several screens: "what did this person
    // work" needed Logs, Approvals and Report, each with its own date range.
    const ADMIN_TABS = ['today', 'timesheets', 'setup'];
    const STAFF_TABS = ['me'];
    // How each Eesa-owned appRole reads in the header.
    const ROLE_LABEL = { admin: 'Admin', staff: 'Staff' };

    async function boot() {
      try {
        CTX = await api('/api/ui/context');
        // Every time on this page is the restaurant's.
        if (CTX.timezone) TZ = CTX.timezone;
        // The workspace's zones in their own order, so each keeps its colour.
        // Without them a mark still gets a colour, taken from the zone's name.
        try {
          ZONE_ORDER = [...new Set((await api('/api/getMyZones')).map((z) => String(z.name || '').trim().toLowerCase()))];
        } catch (_) { ZONE_ORDER = []; }
        // appRole (Eesa authority) is what we branch on: 'admin' | 'staff' | null.
        // Older builds only sent `role` ('manager'|'staff'|null); fall back to it
        // so a mixed deploy still resolves.
        const appRole = CTX.appRole || (CTX.role === 'manager' ? 'admin' : CTX.role) || null;
        const nm = CTX.name || 'You';
        const label = ROLE_LABEL[appRole] || '';
        $('who').innerHTML = `<div class="meta"><div class="nm">${esc(nm)}</div>${label ? `<div class="rl">${esc(label)}</div>` : ''}</div><div class="avatar">${esc(initials(nm))}</div>`;
        if (!appRole) {
          // Claim absent → not enrolled. Clean empty state, no nav.
          $('nav').innerHTML = '';
          $('view').innerHTML = `<div class="card">${empty('inbox', 'You’re not enrolled in attendance yet. Ask an admin to add you to the team.')}</div>`;
          return;
        }
        const tabs = appRole === 'admin' ? ADMIN_TABS : STAFF_TABS;
        document.body.classList.toggle('staff', appRole !== 'admin');
        $('nav').innerHTML = tabs.map((k) => `<button data-tab="${k}">${ic(TABS[k][1])}<span>${TABS[k][0]}</span></button>`).join('');
        $('nav').querySelectorAll('button').forEach((b) => b.onclick = () => go(b.dataset.tab));
        go(tabs[0]);
      } catch (e) {
        $('who').innerHTML = `<span class="err" style="font-size:.8rem">${esc(e.message)}</span>`;
      }
    }

    async function go(tab) {
      TAB = tab;
      $('nav').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
      $('view').innerHTML = '<div class="empty">Loading…</div>';
      try {
        await (VIEWS[tab] || (() => {}))();
        const v = $('view').firstElementChild; if (v) v.classList.add('fade');
      } catch (e) {
        $('view').innerHTML = `<div class="card">${empty('inbox', e.message || 'Something went wrong.')}<div style="text-align:center"><button class="btn small" id="retry">Try again</button></div></div>`;
        const rt = $('retry'); if (rt) rt.onclick = () => go(tab);
      }
    }

    const VIEWS = {};

    // ==================== STAFF ====================
    // One page. The phone checks people in and out as they arrive and leave;
    // nobody does it by hand. What a person adds is why: why they came in, and
    // why they went out, and only when it isn't the usual: a check-in is Work
    // and a check-out is Going home unless they say otherwise. "Outside work"
    // counts the time away until they are back, "Not for work" leaves a visit
    // out, and anything else is a note.
    const WHY = {
      check_in: { label: 'Reason for coming in', question: 'Why did you come in?', usual: 'Work', changes: ['Not for work'], other: false },
      check_out: { label: 'Reason for going out', question: 'Why did you go out?', usual: 'Going home', changes: ['Outside work'], other: true },
    };
    const reasonOf = (e) => e.note || WHY[e.type].usual;
    const CHEV = '<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    // "9:02 AM" on the restaurant's clock, in the phone's own format.
    const hm = (iso) => iso
      ? new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', ...(TZ ? { timeZone: TZ } : {}) })
      : '—';
    // Hours as a stat: "0m" rather than a dash.
    const span = (m) => (Math.round(Number(m || 0)) ? dur(m) : '0m');
    // "Thu, Sep 17" and "Sep 14 – 17", as the phone's locale writes them.
    const utcDay = (d) => { const [y, m, dd] = ymdParts(d); return new Date(Date.UTC(y, m - 1, dd)); };
    const DAY_FMT = new Intl.DateTimeFormat([], { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
    const SPAN_FMT = new Intl.DateTimeFormat([], { month: 'short', day: 'numeric', timeZone: 'UTC' });
    const dayName = (d) => DAY_FMT.format(utcDay(d));
    const rangeName = (f, t) => (f === t ? dayName(f)
      : SPAN_FMT.formatRange ? SPAN_FMT.formatRange(utcDay(f), utcDay(t))
      : `${SPAN_FMT.format(utcDay(f))} – ${SPAN_FMT.format(utcDay(t))}`);

    const MINE = { period: 'week', from: null, to: null, seq: 0, openDay: null, refresh: null };
    const MINE_PERIODS = {
      week: ['This Week', () => [weekRange(0)[0], todayTZ()]],
      last: ['Last Week', () => weekRange(-1)],
      month: ['This Month', () => { const t = todayTZ(); return [t.slice(0, 8) + '01', t]; }],
      custom: ['Custom', () => [MINE.from, MINE.to]],
    };
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && TAB === 'me' && MINE.refresh) MINE.refresh();
    });

    // Over the page, the way iOS asks: Escape or a tap outside closes it, the
    // page behind stays put, and focus goes back where it came from.
    function openSheet(html, { center = false } = {}) {
      const opener = document.activeElement;
      const back = document.createElement('div');
      back.className = center ? 'iback iback--center' : 'iback';
      back.innerHTML = html;
      document.body.appendChild(back);
      document.body.style.overflow = 'hidden';
      let downOnBack = false;
      back.addEventListener('pointerdown', (e) => { downOnBack = e.target === back; });
      back.addEventListener('click', (e) => { if (downOnBack && e.target === back) close(); });
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
      function close() {
        document.removeEventListener('keydown', onKey);
        back.remove();
        document.body.style.overflow = '';
        if (opener && opener.isConnected) opener.focus({ preventScroll: true });
      }
      const first = back.querySelector('[data-autofocus]');
      if (first) first.focus({ preventScroll: true });
      return { el: back, close };
    }

    VIEWS.me = async () => {
      let st = await api('/api/getMyStatus');
      if (st.timezone) TZ = st.timezone;
      const today = todayTZ();
      const yesterday = addDaysYmd(today, -1);
      const monday = weekRange(0)[0];
      const recent = ((await api('/api/getMyHistory?' + new URLSearchParams({
        from: monday < yesterday ? monday : yesterday, to: today,
      }))) || {}).days || [];
      const minutesOn = (d) => Number((recent.find((r) => r.date === d) || {}).totalMinutes || 0);
      const earlierThisWeek = recent
        .filter((r) => r.date >= monday && r.date < today)
        .reduce((a, r) => a + Number(r.totalMinutes || 0), 0);
      // The server counted the open shift up to the moment it answered; only the
      // minutes since then are added here.
      let readAt = Date.now();
      const todayNow = () => Number(st.todayMinutes || 0) + (st.checkedIn ? Math.floor((Date.now() - readAt) / 60000) : 0);

      $('view').innerHTML = `
        <div class="ig" id="mnow"></div>
        <div class="ig sum">
          <div><div class="sum__l">Today</div><div class="sum__n" id="mtoday"></div></div>
          <div><div class="sum__l">Yesterday</div><div class="sum__n">${span(minutesOn(yesterday))}</div></div>
          <div><div class="sum__l">This Week</div><div class="sum__n" id="mweek"></div></div>
        </div>
        <div class="seg" id="mp" role="tablist" aria-label="Period">${Object.entries(MINE_PERIODS).map(([k, [label]]) =>
          `<button type="button" role="tab" data-p="${k}">${label}</button>`).join('')}</div>
        <div class="ig" id="mdates" hidden>
          <label class="cell"><span class="cell__main">From</span><input class="when" type="date" id="mfrom"></label>
          <label class="cell"><span class="cell__main">To</span><input class="when" type="date" id="mto"></label>
        </div>
        <div class="ihead"><span id="mrange"></span><span id="msum"></span></div>
        <div class="ig" id="mdays"></div>`;

      // Today's figure is live everywhere it appears: the tile, its row in the
      // list and the period total, so the three never disagree by a minute.
      let shown = [];
      const minutesFor = (r) => (r.date === today ? todayNow() : Number(r.totalMinutes || 0));
      const totals = () => {
        if (!$('mtoday')) return;
        $('mtoday').textContent = span(todayNow());
        $('mweek').textContent = span(earlierThisWeek + todayNow());
        if (shown.length) $('msum').textContent = span(shown.reduce((a, r) => a + minutesFor(r), 0));
        const row = $('mdays').querySelector(`[data-day="${today}"] .cell__detail`);
        if (row) row.textContent = span(todayNow());
      };
      const adopt = (next) => { st = next; readAt = Date.now(); paintNow(); totals(); };
      // Disabled while it works; a failure says why and gives the button back.
      const busy = async (btn, work) => {
        btn.disabled = true;
        try { await work(); } catch (e) {
          toast(e.message || 'That did not go through. Try again.', true);
          if (btn.isConnected) btn.disabled = false;
        }
      };

      // A reason changes the day's hours, so everything is read again.
      const save = async (e, reason, sheet) => {
        await api('/api/setMyReason', { method: 'POST', body: { eventId: e.id, reason } });
        sheet.close();
        await VIEWS.me();
      };

      const askWhy = (e) => {
        const w = WHY[e.type];
        // Only what it can change to: the usual is offered once something else was chosen.
        const choices = [w.usual, ...w.changes].filter((r) => r !== reasonOf(e));
        const s = openSheet(`
          <div class="iaction" role="alertdialog" aria-modal="true" aria-labelledby="wt">
            <div class="ig"><div class="msg" id="wt">${w.question}</div>
              ${choices.map((r) => `<button type="button" data-r="${esc(r)}">${esc(r)}</button>`).join('')}
              ${w.other ? '<button type="button" data-other>Other…</button>' : ''}</div>
            <div class="ig"><button type="button" class="strong" data-x data-autofocus>Cancel</button></div>
          </div>`);
        s.el.querySelector('[data-x]').onclick = s.close;
        s.el.querySelectorAll('[data-r]').forEach((b) => { b.onclick = () => busy(b, () => save(e, b.dataset.r, s)); });
        const other = s.el.querySelector('[data-other]');
        if (other) other.onclick = () => { s.close(); askOther(e); };
      };

      const askOther = (e) => {
        const w = WHY[e.type];
        const typed = e.note && ![w.usual, ...w.changes].includes(e.note) ? e.note : '';
        const s = openSheet(`
          <div class="ialert" role="alertdialog" aria-modal="true" aria-labelledby="ot">
            <div class="ialert__body"><h3 id="ot">${w.label}</h3>
              <input id="oreason" maxlength="120" placeholder="Reason" autocomplete="off" enterkeyhint="done" value="${esc(typed)}" data-autofocus></div>
            <div class="ialert__acts"><button type="button" data-x>Cancel</button><button type="button" data-ok>Save</button></div>
          </div>`, { center: true });
        const input = s.el.querySelector('#oreason');
        const ok = s.el.querySelector('[data-ok]');
        const sync = () => { ok.disabled = !input.value.trim(); };
        sync();
        input.oninput = sync;
        input.onkeydown = (ev) => { if (ev.key === 'Enter' && !ok.disabled) ok.click(); };
        s.el.querySelector('[data-x]').onclick = s.close;
        ok.onclick = () => busy(ok, () => save(e, input.value.trim(), s));
      };

      // The reason row under a check-in or check-out.
      const reasonCell = (e, attrs) => `<button class="cell" type="button" ${attrs}>
          <span class="cell__label">${WHY[e.type].label}</span>
          <span class="cell__detail cell__value">${esc(reasonOf(e))}</span>${CHEV}
        </button>`;

      const paintNow = () => {
        const box = $('mnow');
        if (!box) return;
        // Today's punches, newest first: the latest says where they stand.
        const last = (st.events || [])[0];
        const where = last && last.zoneName ? ` · ${zoneMark(last.zoneName)}` : '';
        const [state, sub] = !last ? ['Not checked in', 'You’re checked in automatically when you arrive.']
          : last.type === 'check_in' ? ['Checked in', `Since ${hm(st.checkedIn ? st.since : last.at)}${where}`]
          : ['Checked out', `Left at ${hm(last.at)}${where}`];
        box.innerHTML = `
          <div class="cell"><span class="dot${st.checkedIn ? ' dot--in' : ''}"></span>
            <span class="cell__main"><span class="cell__title state">${state}</span><span class="cell__sub">${sub}</span></span></div>
          ${last ? reasonCell(last, 'id="mwhy"') : ''}`;
        if (last) $('mwhy').onclick = () => askWhy(last);
      };

      const dayRow = (r) => {
        const end = r.status === 'open' ? 'now' : r.lastOut ? hm(r.lastOut) : 'no check-out';
        return `<button class="cell" type="button" data-day="${esc(r.date)}" aria-expanded="false">
            <span class="cell__main"><span class="cell__title">${esc(dayName(r.date))}</span>
              <span class="cell__sub">${r.firstIn ? `${hm(r.firstIn)} – ${end}` : '—'}</span></span>
            <span class="cell__detail">${span(minutesFor(r))}</span>${CHEV}
          </button>
          <div class="punches" id="mpd-${esc(r.date)}" hidden></div>`;
      };
      // Reasons can still be changed for today and yesterday.
      const punchRow = (e, editable) => {
        const inner = `<span class="cell__main">
            <span class="cell__title">${e.type === 'check_in' ? 'Checked in' : 'Checked out'}</span>
            <span class="cell__sub">${e.zoneName ? `${zoneMark(e.zoneName)} · ` : ''}${esc(reasonOf(e))}</span></span>
          <span class="cell__detail">${hm(e.at)}</span>`;
        return editable ? `<button class="cell" type="button" data-punch="${esc(e.id)}">${inner}${CHEV}</button>` : `<div class="cell">${inner}</div>`;
      };
      const note = (text, cls = '') => `<div class="cell"><span class="cell__sub ${cls}">${esc(text)}</span></div>`;

      const openDay = async (el) => {
        const day = el.dataset.day;
        const box = $('mpd-' + day);
        box.hidden = false;
        el.setAttribute('aria-expanded', 'true');
        MINE.openDay = day;
        box.innerHTML = note('Loading…');
        try {
          const evs = (await api('/api/getMyEvents?' + new URLSearchParams({ from: day, to: day }))).slice().reverse();
          const editable = day >= yesterday;
          box.innerHTML = evs.length ? evs.map((e) => punchRow(e, editable)).join('') : note('Nothing recorded on this day.');
          box.querySelectorAll('[data-punch]').forEach((b) => {
            b.onclick = () => askWhy(evs.find((e) => String(e.id) === b.dataset.punch));
          });
        } catch (e) {
          box.innerHTML = note(e.message, 'err');
        }
      };

      const list = async () => {
        const seq = ++MINE.seq;
        const [from, to] = MINE_PERIODS[MINE.period][1]();
        $('mp').querySelectorAll('button').forEach((b) => {
          const on = b.dataset.p === MINE.period;
          b.classList.toggle('active', on);
          b.setAttribute('aria-selected', String(on));
        });
        $('mdates').hidden = MINE.period !== 'custom';
        $('mrange').textContent = rangeName(from, to);
        shown = [];
        $('msum').textContent = '';
        $('mdays').innerHTML = note('Loading…');
        try {
          const data = await api('/api/getMyHistory?' + new URLSearchParams({ from, to }));
          if (seq !== MINE.seq || !$('mdays')) return;
          const rows = ((data && data.days) || []).filter((r) => Number(r.totalMinutes) > 0 || r.firstIn);
          shown = rows;
          $('msum').textContent = rows.length ? span(rows.reduce((a, r) => a + minutesFor(r), 0)) : '';
          $('mdays').innerHTML = rows.length ? rows.map(dayRow).join('') : note('No hours on these dates.');
          $('mdays').querySelectorAll('[data-day]').forEach((el) => {
            el.onclick = () => {
              const box = $('mpd-' + el.dataset.day);
              if (!box.hidden) {
                box.hidden = true;
                el.setAttribute('aria-expanded', 'false');
                MINE.openDay = null;
                return;
              }
              openDay(el);
            };
          });
          const reopen = MINE.openDay && $('mdays').querySelector(`[data-day="${MINE.openDay}"]`);
          if (reopen) openDay(reopen);
        } catch (e) {
          if (seq === MINE.seq && $('mdays')) $('mdays').innerHTML = note(e.message, 'err');
        }
      };

      $('mp').querySelectorAll('button').forEach((b) => {
        b.onclick = () => {
          if (b.dataset.p === 'custom' && !MINE.from) [MINE.from, MINE.to] = MINE_PERIODS[MINE.period][1]();
          MINE.period = b.dataset.p;
          if (MINE.period === 'custom') { $('mfrom').value = MINE.from; $('mto').value = MINE.to; }
          list();
        };
      });
      const pick = () => {
        const f = $('mfrom').value, t = $('mto').value;
        if (!f || !t) return;
        // A backwards range would read as "no hours", so swap it.
        [MINE.from, MINE.to] = f <= t ? [f, t] : [t, f];
        list();
      };
      $('mfrom').onchange = pick;
      $('mto').onchange = pick;
      if (MINE.from) { $('mfrom').value = MINE.from; $('mto').value = MINE.to; }

      // Back in the app after a while: the phone may have checked them in or out.
      // Not while something is being asked.
      MINE.refresh = async () => {
        if (document.querySelector('.iback')) return;
        try { adopt(await api('/api/getMyStatus')); } catch (e) { toast(e.message, true); }
      };
      paintNow();
      totals();
      list();
      clearInterval(ME_TICK);
      ME_TICK = setInterval(() => {
        if (TAB !== 'me' || !$('mtoday')) { clearInterval(ME_TICK); return; }
        totals();
      }, 30000);
    };

    // ==================== ADMIN ====================
    // Four sections, grouped by what an admin is actually trying to do, rather
    // than by which database table the screen happens to read:
    //
    //   Today       who is here right now, and where
    //   Timesheets  what people worked, and any day that needs a fix
    //   People      who is enrolled, as what, at what rate
    //   Setup       the things you configure once: zones, shifts, timezone
    //
    // The previous eight tabs split one question across several places — "what
    // did this person work" lived in Logs, Approvals AND Report, each with its
    // own date range to set. Timesheets is now a single range and one drill-down
    // path: everyone -> one person's days -> the punches behind a day.

    // ---- shared bits -------------------------------------------------------

    // Everyone enrolled, for the "pick a person" controls.
    const enrolled = async () => (await api('/api/admin/members')).filter((m) => m.attendanceRole);

    // ==================== TODAY ====================
    // What is happening right now. Nothing here asks a question: arrivals record
    // themselves, and a day that needs a fix is fixed from Timesheets.
    VIEWS.today = async () => {
      const [from, to] = weekRange(0);
      const [presence, zones, week, members] = await Promise.all([
        api('/api/admin/presence'),
        api('/api/admin/zones').catch(() => []),
        api('/api/admin/approvals?' + new URLSearchParams({ from, to })).catch(() => []),
        api('/api/admin/members').catch(() => []),
      ]);
      // Staff whose phone can't record their hours by itself. Unknown until the
      // roster reports phones at all, and then the zone count shows instead.
      const phonesKnown = members.some((m) => 'device' in m);
      const notReady = members.filter((m) => m.attendanceRole === 'staff' && 'device' in m && !(m.device && m.device.ready)).length;
      const rows = presence.employees || [];
      const people = rows.filter((p) => p.lastLocation);
      const inNow = rows.filter((r) => r.checkedIn).length;
      const needsFix = week.filter((d) => d.needsFix).length;
      const hasMap = typeof window.L !== 'undefined';

      $('view').innerHTML = `
        ${needsFix ? `<div class="card needs">
          <h2>${ic('activity')} ${needsFix === 1 ? 'One day needs' : `${needsFix} days need`} a fix</h2>
          <p class="lead">This week has ${needsFix === 1 ? 'a day' : 'days'} with a missing or doubtful time. Tap ${needsFix === 1 ? 'it' : 'each one'} in Timesheets to put the times right.</p>
          <button class="btn primary" id="gofix">Open Timesheets</button>
        </div>` : ''}

        <div class="hero ${inNow ? 'hero--on' : ''}">
          <div class="hero__top">
            <div class="hero__badge"></div>
            <div class="hero__state">${inNow ? `${inNow} at work now` : 'Nobody at work right now'}</div>
          </div>
          <div class="stats">
            <div class="stat"><div class="stat__num num">${rows.length}</div><div class="stat__lbl">Came in today</div></div>
            ${phonesKnown
              ? `<div class="stat" id="goready" role="button" tabindex="0" style="cursor:pointer"><div class="stat__num num">${notReady}</div><div class="stat__lbl">Phones not ready</div></div>`
              : `<div class="stat"><div class="stat__num num">${zones.length}</div><div class="stat__lbl">Work zones</div></div>`}
            <div class="stat"><div class="stat__num num">${needsFix}</div><div class="stat__lbl">Need a fix</div></div>
          </div>
        </div>

        <div class="card">
          <h2>${ic('users')} Who's in</h2>
          ${rows.length ? `
            <div class="toolbar">
              <input class="search" id="pq" type="search" placeholder="Search name" autocomplete="off">
              <select id="pf">
                <option value="">Everyone today</option>
                <option value="in">At work</option>
                <option value="out">Out</option>
              </select>
              <span class="count" id="pcount"></span>
            </div>
            <div id="pbody"></div>`
            : empty('activity', 'Nobody has come in yet today.')}
        </div>

        ${hasMap && people.length ? `<div class="card">
          <h2>${ic('pin')} Where everyone is</h2>
          <div id="zmap"></div>
          <div class="legend">
            <span class="k"><span class="dot" style="background:var(--success)"></span> At work (${inNow})</span>
            <span class="k"><span class="dot" style="background:var(--muted)"></span> Out</span>
            <span class="k"><span class="dot" style="background:transparent;border:2px solid #8aa0a8"></span> Work zone</span>
          </div>
          <div class="map-hint">Each dot is where that person was when they arrived or left — phones report at the zone edge, not continuously.</div>
        </div>` : ''}`;

      const gofix = $('gofix');
      if (gofix) gofix.onclick = () => go('timesheets');
      const goready = $('goready');
      if (goready) goready.onclick = goready.onkeydown = (e) => { if (!e.key || e.key === 'Enter') go('setup'); };

      if (rows.length) {
        const render = () => {
          const qy = ($('pq').value || '').trim().toLowerCase();
          const f = $('pf').value;
          const list = rows.filter((r) => {
            if (qy && !`${r.name || ''} ${r.email || ''} ${r.employeeRef}`.toLowerCase().includes(qy)) return false;
            if (f === 'in' && !r.checkedIn) return false;
            if (f === 'out' && r.checkedIn) return false;
            return true;
          });
          $('pcount').textContent = list.length === rows.length
            ? `${rows.length} ${rows.length === 1 ? 'person' : 'people'}`
            : `${list.length} of ${rows.length}`;
          $('pbody').innerHTML = list.length
            ? `<div class="tablewrap"><table><thead><tr><th>Name</th><th></th><th>Since</th><th>Where</th></tr></thead><tbody>
              ${list.map((r) => `<tr>
                <td><div style="font-weight:600">${esc(r.name || r.employeeRef)}</div></td>
                <td>${r.checkedIn ? '<span class="pill complete">At work</span>' : '<span class="pill">Out</span>'}${r.reason ? ` <span class="muted" style="font-size:.78rem">${esc(r.reason)}</span>` : ''}</td>
                <td class="num">${timeOf(r.at)}</td>
                <td>${whereText(r.lastLocation)}</td>
              </tr>`).join('')}</tbody></table></div>`
            : empty('activity', 'Nobody matches those filters.');
        };
        $('pq').oninput = render;
        $('pf').onchange = render;
        render();
      }

      if (hasMap && people.length) drawZoneMap(zones, people, { editable: false });
    };

    // ==================== TIMESHEETS ====================
    // One week at a time. Everyone's days on one screen; a day that needs a fix
    // says so; tap it, fix it, and approve the whole week in one tap. Nothing is
    // approved day by day any more.
    let WEEK = 0; // 0 = this week, -1 = last week
    VIEWS.timesheets = async () => {
      const [from, to] = weekRange(WEEK);
      const days = [0, 1, 2, 3, 4, 5, 6].map((i) => addDaysYmd(from, i));
      const [approvals, members] = await Promise.all([
        api('/api/admin/approvals?' + new URLSearchParams({ from, to })),
        api('/api/admin/members').catch(() => []),
      ]);
      const today = todayTZ();
      const byRef = new Map();
      const person = (ref, name) => {
        if (!byRef.has(ref)) byRef.set(ref, { ref, name: name || ref, days: {} });
        return byRef.get(ref);
      };
      for (const m of members) {
        if (m.attendanceRole) person(String(m.employeeRef), m.name || m.email);
      }
      for (const d of approvals) person(String(d.employeeRef), d.name).days[d.day] = d;
      const people = [...byRef.values()].map((p) => {
        const list = Object.values(p.days);
        const settled = list.filter((d) => !d.open);
        return {
          ...p,
          total: settled.reduce((n, d) => n + d.totalMinutes, 0),
          fix: list.filter((d) => d.needsFix).length,
          any: list.length > 0,
        };
      }).sort((x, y) => (y.any - x.any) || String(x.name).localeCompare(String(y.name)));

      const cell = (p, day) => {
        const d = p.days[day];
        const attrs = `data-ref="${esc(p.ref)}" data-day="${day}"`;
        if (!d) return `<button class="cell none" ${attrs} ${day > today ? 'disabled' : ''} title="Nothing recorded">–</button>`;
        if (d.open) return `<button class="cell open" ${attrs} title="At work now">${dur(d.totalMinutes)}</button>`;
        if (d.needsFix) return `<button class="cell fix" ${attrs} title="Needs a fix">${d.totalMinutes ? dur(d.totalMinutes) : 'Fix'}</button>`;
        const edited = d.corrected ? ' changed' : '';
        return `<button class="cell${edited}" ${attrs} ${d.corrected ? 'title="Changed by a manager"' : ''}>${dur(d.totalMinutes)}</button>`;
      };
      const action = (p) => {
        if (p.fix) return `<span class="pill pending">Fix ${p.fix}</span>`;
        return '';
      };
      const title = WEEK === 0 ? 'This week' : WEEK === -1 ? 'Last week' : `${-WEEK} weeks ago`;

      $('view').innerHTML = `<div class="card">
        <h2>${ic('chart')} Timesheets</h2>
        <div class="weekbar">
          <button class="btn small" id="wkprev" type="button" aria-label="Previous week">‹</button>
          <div class="weeklbl"><b>${title}</b><span>${rangeLabel(from, to)}</span></div>
          <button class="btn small" id="wknext" type="button" aria-label="Next week" ${WEEK >= 0 ? 'disabled' : ''}>›</button>
        </div>
        ${people.length ? `<div class="wkgrid">
          <div class="wk head"><div class="who">Name</div>${days.map((d) => `<div class="d">${WDAYS[wdayOf(d)]}<span>${ymdParts(d)[2]}</span></div>`).join('')}<div class="tot">Week</div><div class="act"></div></div>
          ${people.map((p) => `<div class="wk">
            <div class="who">${esc(p.name)}</div>
            ${days.map((d) => `<div class="d">${cell(p, d)}</div>`).join('')}
            <div class="tot">${p.total ? dur(p.total) : '—'}</div>
            <div class="act">${action(p)}</div>
          </div>`).join('')}
        </div>
        <div class="legendrow">
          <span><i style="background:var(--warn-weak);border-color:var(--warn)"></i>Needs a fix</span>
          <span><i style="border-color:var(--success)"></i>At work now</span>
          <span>✎ Changed by a manager</span>
          <span>Tap any day to see or fix its times.</span>
        </div>` : empty('users', 'Nobody has attendance yet.')}
      </div>`;

      $('wkprev').onclick = () => { WEEK -= 1; go('timesheets'); };
      $('wknext').onclick = () => { if (WEEK < 0) { WEEK += 1; go('timesheets'); } };
      $('view').querySelectorAll('button.cell').forEach((b) => b.onclick = () => {
        const p = byRef.get(b.dataset.ref);
        openDay(p ? p.name : b.dataset.ref, b.dataset.ref, b.dataset.day, p && p.days[b.dataset.day]);
      });
    };

    // Fix times: one day, with what the phone saw, the times to save, and Undo.
    async function openDay(name, ref, day, d) {
      const back = document.createElement('div');
      back.className = 'sheet-back';
      const close = () => back.remove();
      const hand = (d && d.handOuts) || [];
      const flags = ((d && d.flags) || []).filter((f) => FLAG_TEXT[f]);
      // The latest moment they were really there: the phone's exit after a hand
      // check-out, or a later departure if they came back (Jeeva, 15 Sep: out by
      // hand 10:51, left 15:25, back 15:33, gone 17:17 — the day ends at 17:17).
      const suggestOut = d && [d.leftZoneAt, d.lastOut].filter(Boolean).sort().pop();
      back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fxttl">
        <h3 id="fxttl">${esc(name)}</h3>
        <div class="sub">${esc(dayLabel(day))}${!d ? ' · nothing recorded' : `${d.totalMinutes ? ` · ${dur(d.totalMinutes)}` : ''}${d.open ? ' · at work now' : ''}${d.corrected ? ' · changed by a manager' : ''}`}</div>
        ${hand.length ? `<div class="evidence">${hand.map((h) =>
          `Checked out by hand at <b>${esc(timeOf(h.checkedOutAt))}</b>. The phone left the zone at <b>${esc(timeOf(h.leftZoneAt))}</b>.`).join('<br>')}${
          d.lastOut && d.lastOut > d.leftZoneAt ? `<br>Last left at <b>${esc(timeOf(d.lastOut))}</b>.` : ''}</div>` : ''}
        ${flags.length && !hand.length ? `<div class="note">${flags.map((f) => esc(FLAG_TEXT[f])).join('<br>')}</div>` : ''}
        <div class="times">
          <label class="field">In<input type="time" id="fxin" value="${d && d.firstIn ? hmTZ(d.firstIn) : ''}"></label>
          <label class="field">Out<input type="time" id="fxout" value="${suggestOut ? hmTZ(suggestOut) : ''}"></label>
        </div>
        <div class="acts">
          ${d && d.corrected ? '<button class="btn" id="fxundo" type="button">Use the phone’s times</button>' : ''}
          <button class="btn" id="fxcancel" type="button">Cancel</button>
          <button class="btn primary" id="fxsave" type="button">Save</button>
        </div>
        ${d ? `<details><summary>What the phone recorded</summary><div id="fxevents" class="muted" style="margin-top:8px">Loading…</div></details>` : ''}
      </div>`;
      document.body.appendChild(back);
      back.addEventListener('mousedown', (e) => { if (e.target === back) close(); });
      $('fxcancel').onclick = close;
      const onKey = (e) => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } };
      document.addEventListener('keydown', onKey);
      $('fxin').focus();

      const undo = async () => {
        try {
          await api(`/api/admin/days/${encodeURIComponent(ref)}/${day}/correction`, { method: 'DELETE' });
          toast('Back to the phone’s times');
          go('timesheets');
        } catch (e) { toast(e.message, true); }
      };
      if ($('fxundo')) $('fxundo').onclick = async () => { close(); await undo(); };

      $('fxsave').onclick = async () => {
        const inV = $('fxin').value, outV = $('fxout').value;
        if (!inV || !outV) return toast('Enter both times', true);
        const firstIn = zonedIso(day, inV);
        let lastOut = zonedIso(day, outV);
        // An out time before the in time is the next morning — a late shift.
        if (lastOut <= firstIn) lastOut = zonedIso(addDaysYmd(day, 1), outV);
        $('fxsave').disabled = true;
        try {
          await api(`/api/admin/days/${encodeURIComponent(ref)}/${day}`, { method: 'PUT', body: { firstIn, lastOut } });
          close();
          toastUndo(`Saved · ${name} · ${dayLabel(day)}`, undo);
          go('timesheets');
        } catch (e) { $('fxsave').disabled = false; toast(e.message, true); }
      };

      if (d) {
        api('/api/admin/events?' + new URLSearchParams({ employeeRef: ref, from: day, to: addDaysYmd(day, 1) }))
          .then((evs) => {
            const el = $('fxevents'); if (!el) return;
            // Only this shift's punches: from its first arrival to its last departure.
            const mine = evs.filter((e) => (!d.firstIn || e.at >= d.firstIn) && (!d.lastOut || e.at <= d.lastOut)).reverse();
            el.innerHTML = mine.length ? mine.map(eventHtml).join('') : 'No punches.';
          })
          .catch(() => { const el = $('fxevents'); if (el) el.textContent = 'Could not load the punches.'; });
      }
    }


    // ==================== PEOPLE ====================
    // Who is enrolled, as what, at what rate, and which job types they may pick.
    // The job-type catalog lives here too — it is only ever useful next to the
    // people you assign it to.
    async function renderPeople(host) {
      const resp = await apiFull('/api/admin/members');
      const rows = resp.data || [];
      const catalog = await api('/api/admin/work-types').catch(() => []);
      const d = resp.diag;
      const banner = (rows.length === 0 && d && d.error)
        ? `<div class="card" style="border-color:var(--danger)">
            <h2 style="color:var(--danger)">${ic('inbox')} Couldn’t load your roster</h2>
            <div>${esc(d.error)}</div>
            <div class="muted" style="font-size:.72rem;margin-top:8px">backend: ${esc(d.apiBase)} · secret set: ${d.hasSecret} · workspace: ${esc(d.tenantId || '—')} · status: ${d.status == null ? '—' : d.status}</div>
          </div>` : '';

      host.innerHTML = banner + `<div class="card">
        <h2>${ic('users')} People</h2>
        <p class="lead">Everyone in your workspace. Who has attendance, and who is an admin, is set in Eesa. Phone shows whether their phone can record their hours by itself. The pay rate is what Timesheets use.</p>
        ${rows.length ? `
        <div class="toolbar">
          <input class="search" id="tq" type="search" placeholder="Search name or email" autocomplete="off">
          ${catalog.length ? `<select id="tjob">
            <option value="">All job types</option>
            ${catalog.map((w) => `<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('')}
            <option value="__none">No job types assigned</option>
          </select>` : ''}
          <span class="count" id="tcount"></span>
        </div>
        <div id="tbody"></div>` : empty('users', 'No teammates found in your workspace roster.')}
      </div>
      <details class="card fold">
        <summary>${ic('briefcase')} Job types</summary>
        <p class="lead">What people can say they're here to do when they check in. Assign them per person above.</p>
        <div id="wtlist">${catalog.length
          ? `<div class="chips">${catalog.map((w) => `<span class="chip">${esc(w.name)}<button class="btn link" data-w="${esc(w.id)}" title="Remove" style="padding:0 2px;margin-left:2px">✕</button></span>`).join('')}</div>`
